<script>
  (() => {
    let mode = 'pomodoro'; // 'pomodoro' | 'timer'
    let currentInterval = 1;
    const totalIntervals = 4;
    let isBreak = false;

    let totalSeconds = 1497; // 24:57 active countdown state
    let currentMaxSeconds = 1500;
    let isRunning = true;
    let timerInterval = null;

    const timerDisplay = document.getElementById('timer-display');
    const ring = document.getElementById('timer-progress-ring');
    const toggleBtn = document.getElementById('toggle-btn');
    const playIcon = document.getElementById('play-icon');
    const playText = document.getElementById('play-text');
    const resetBtn = document.getElementById('reset-btn');
    const skipBtn = document.getElementById('skip-btn');
    const cycleBadge = document.getElementById('cycle-badge');
    const cycleText = document.getElementById('cycle-text');
    const targetLabel = document.getElementById('target-label');
    const targetDurationText = document.getElementById('target-duration-text');
    const sessionPhaseText = document.getElementById('session-phase-text');
    const activitySelect = document.getElementById('activity-select');
    const labelSelect = document.getElementById('label-select');
    const detailsSummary = document.getElementById('details-summary');
    const activityPreviewText = document.getElementById('activity-preview-text');

    const circumference = 2 * Math.PI * 100; // r = 100

    function formatTime(secs) {
      const m = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = (secs % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateVisuals() {
      if (timerDisplay) {
        timerDisplay.textContent = formatTime(totalSeconds);
      }
      if (ring) {
        const fraction = totalSeconds / currentMaxSeconds;
        const offset = circumference * (1 - fraction);
        ring.style.strokeDashoffset = offset;
      }
    }

    function tick() {
      if (totalSeconds > 0) {
        totalSeconds--;
        updateVisuals();
      } else {
        if (mode === 'pomodoro') {
          if (!isBreak) {
            isBreak = true;
            totalSeconds = 300; // 5 min break
            currentMaxSeconds = 300;
            sessionPhaseText.innerHTML = '<span class="material-symbols-outlined text-[14px]">coffee</span> Break Active';
            cycleText.textContent = `Rest • Cycle ${currentInterval}/${totalIntervals}`;
          } else {
            isBreak = false;
            currentInterval = currentInterval < totalIntervals ? currentInterval + 1 : 1;
            totalSeconds = 1500;
            currentMaxSeconds = 1500;
            sessionPhaseText.innerHTML = '<span class="material-symbols-outlined text-[14px]">lock_clock</span> Focus Active';
            cycleText.textContent = `Focus • Cycle ${currentInterval}/${totalIntervals}`;
          }
          updateVisuals();
        } else {
          clearInterval(timerInterval);
          isRunning = false;
          playIcon.textContent = 'play_arrow';
          playText.textContent = 'Start';
        }
      }
    }

    timerInterval = setInterval(tick, 1000);
    updateVisuals();

    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        isRunning = !isRunning;
        if (isRunning) {
          playIcon.textContent = 'pause';
          playText.textContent = 'Pause';
          timerInterval = setInterval(tick, 1000);
        } else {
          playIcon.textContent = 'play_arrow';
          playText.textContent = 'Resume';
          clearInterval(timerInterval);
        }
      });
    }

    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        totalSeconds = currentMaxSeconds;
        updateVisuals();
      });
    }

    if (skipBtn) {
      skipBtn.addEventListener('click', () => {
        if (mode === 'pomodoro') {
          isBreak = !isBreak;
          if (isBreak) {
            totalSeconds = 300;
            currentMaxSeconds = 300;
            sessionPhaseText.innerHTML = '<span class="material-symbols-outlined text-[14px]">coffee</span> Break Active';
            cycleText.textContent = `Rest • Cycle ${currentInterval}/${totalIntervals}`;
          } else {
            currentInterval = currentInterval < totalIntervals ? currentInterval + 1 : 1;
            totalSeconds = 1500;
            currentMaxSeconds = 1500;
            sessionPhaseText.innerHTML = '<span class="material-symbols-outlined text-[14px]">lock_clock</span> Focus Active';
            cycleText.textContent = `Focus • Cycle ${currentInterval}/${totalIntervals}`;
          }
        } else {
          totalSeconds = currentMaxSeconds;
        }
        updateVisuals();
      });
    }

    // Time Plus/Minus Buttons
    const plusBtn = document.getElementById('time-plus-btn');
    const minusBtn = document.getElementById('time-minus-btn');

    if (plusBtn) {
      plusBtn.addEventListener('click', () => {
        totalSeconds += 300;
        currentMaxSeconds += 300;
        targetDurationText.textContent = `${Math.round(currentMaxSeconds / 60)}m Block`;
        updateVisuals();
      });
    }

    if (minusBtn) {
      minusBtn.addEventListener('click', () => {
        if (totalSeconds > 300 && currentMaxSeconds > 300) {
          totalSeconds -= 300;
          currentMaxSeconds -= 300;
          targetDurationText.textContent = `${Math.round(currentMaxSeconds / 60)}m Block`;
          updateVisuals();
        }
      });
    }

    // Mode Switcher Buttons
    const modePomodoroBtn = document.getElementById('mode-pomodoro');
    const modeTimerBtn = document.getElementById('mode-timer');

    modePomodoroBtn.addEventListener('click', () => {
      mode = 'pomodoro';
      modePomodoroBtn.className = "mode-tab flex-1 py-2 px-3 rounded-xl font-semibold text-xs transition-all flex items-center justify-center gap-1.5 bg-[#171d27] text-[#a855f7] shadow-sm border border-purple-500/20";
      modeTimerBtn.className = "mode-tab flex-1 py-2 px-3 rounded-xl font-semibold text-xs transition-all flex items-center justify-center gap-1.5 text-text-secondary hover:text-text-primary border border-transparent";
      cycleBadge.classList.remove('hidden');
      cycleText.textContent = `Focus • Cycle ${currentInterval}/${totalIntervals}`;
      currentMaxSeconds = 1500;
      totalSeconds = 1500;
      targetDurationText.textContent = '25m Pomodoro';
      updateVisuals();
    });

    modeTimerBtn.addEventListener('click', () => {
      mode = 'timer';
      modeTimerBtn.className = "mode-tab flex-1 py-2 px-3 rounded-xl font-semibold text-xs transition-all flex items-center justify-center gap-1.5 bg-[#171d27] text-[#a855f7] shadow-sm border border-purple-500/20";
      modePomodoroBtn.className = "mode-tab flex-1 py-2 px-3 rounded-xl font-semibold text-xs transition-all flex items-center justify-center gap-1.5 text-text-secondary hover:text-text-primary border border-transparent";
      cycleBadge.classList.add('hidden');
      targetDurationText.textContent = `${Math.round(currentMaxSeconds / 60)}m Countdown`;
      sessionPhaseText.innerHTML = '<span class="material-symbols-outlined text-[14px]">hourglass_bottom</span> Custom Timer';
      updateVisuals();
    });

    // Preset Pills
    document.querySelectorAll('.time-preset-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.time-preset-pill').forEach(p => {
          p.classList.remove('bg-[#171d27]', 'border-purple-500/50', 'shadow-[0_0_12px_rgba(168,85,247,0.15)]');
          p.classList.add('bg-[#0f141c]', 'border-border-subtle');
          const txt = p.querySelector('.font-mono');
          if (txt) {
            txt.classList.remove('text-[#a855f7]');
            txt.classList.add('text-text-primary');
          }
        });

        pill.classList.remove('bg-[#0f141c]', 'border-border-subtle');
        pill.classList.add('bg-[#171d27]', 'border-purple-500/50', 'shadow-[0_0_12px_rgba(168,85,247,0.15)]');
        const txt = pill.querySelector('.font-mono');
        if (txt) {
          txt.classList.remove('text-text-primary');
          txt.classList.add('text-[#a855f7]');
        }

        const mins = parseInt(pill.getAttribute('data-minutes') || '25', 10);
        currentMaxSeconds = mins * 60;
        totalSeconds = mins * 60;
        targetDurationText.textContent = `${mins}m Block`;
        updateVisuals();
      });
    });

    // Custom Time Toggle & Apply
    const customToggle = document.getElementById('custom-time-toggle');
    const customPanel = document.getElementById('custom-time-panel');
    const customApply = document.getElementById('apply-custom-time');
    const customInput = document.getElementById('custom-minutes-input');

    customToggle.addEventListener('click', () => {
      customPanel.classList.toggle('hidden');
    });

    customApply.addEventListener('click', () => {
      const val = parseInt(customInput.value, 10);
      if (val && val > 0) {
        currentMaxSeconds = val * 60;
        totalSeconds = val * 60;
        targetDurationText.textContent = `${val}m Custom`;
        updateVisuals();
        customPanel.classList.add('hidden');
      }
    });

    // Activity & Label Dropdown Handlers
    function updateDetailsSummary() {
      const act = activitySelect ? activitySelect.value : 'Deep Work';
      const lbl = labelSelect ? labelSelect.value : '#urgent';
      if (detailsSummary) {
        detailsSummary.textContent = `${act} • ${lbl}`;
      }
      if (activityPreviewText) {
        activityPreviewText.textContent = act;
      }
    }

    if (activitySelect) {
      activitySelect.addEventListener('change', updateDetailsSummary);
    }

    if (labelSelect) {
      labelSelect.addEventListener('change', () => {
        if (labelSelect.value === '__new__') {
          const userTag = prompt('Enter new tag name: (e.g. #creative)');
          if (userTag && userTag.trim()) {
            let clean = userTag.trim();
            if (!clean.startsWith('#')) clean = '#' + clean;
            const opt = document.createElement('option');
            opt.value = clean;
            opt.textContent = clean;
            labelSelect.insertBefore(opt, labelSelect.lastElementChild);
            labelSelect.value = clean;
          } else {
            labelSelect.value = '#urgent';
          }
        }
        updateDetailsSummary();
      });
    }

    // Notes Parking Lot Form
    const parkingForm = document.getElementById('parking-form');
    const parkingInput = document.getElementById('parking-input');
    const parkingShelf = document.getElementById('parking-shelf');

    if (parkingForm && parkingInput && parkingShelf) {
      parkingForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const value = parkingInput.value.trim();
        if (!value) return;

        const entry = document.createElement('div');
        entry.className = 'flex items-center justify-between px-3 py-2 bg-[#0f141c] border border-border-subtle rounded-xl text-text-secondary';
        entry.innerHTML = `
          <div class="flex items-center space-x-2.5 min-w-0">
            <span class="w-1.5 h-1.5 rounded-full bg-[#a855f7] shadow-[0_0_6px_rgba(168,85,247,0.6)]"></span>
            <span class="font-medium text-xs text-text-primary truncate">${value}</span>
          </div>
          <button class="text-text-muted hover:text-danger p-0.5 ml-2 transition-colors remove-btn">
            <span class="material-symbols-outlined text-[15px]">done</span>
          </button>
        `;

        entry.querySelector('.remove-btn').addEventListener('click', () => {
          entry.remove();
        });

        parkingShelf.prepend(entry);
        parkingInput.value = '';
      });

      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          this.closest('div.flex').remove();
        });
      });
    }
  })();
</script>

</body></html>
