ortant; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-surface text-on-surface font-body-md min-h-full flex flex-col items-center antialiased"><div class="w-full max-w-[480px] min-h-screen flex flex-col relative bg-surface"><header class="fixed top-0 w-full max-w-[480px] z-50 bg-surface/85 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.03)]"><div class="h-16 px-space-md flex items-center justify-between"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-lg text-on-surface hover:bg-surface-container-high/60 transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex flex-col items-center text-center px-space-xs"><h1 class="font-headline-sm text-headline-sm text-on-surface font-medium leading-none">Weekly Digest</h1><p class="font-label-sm text-label-sm text-on-surface-variant font-normal mt-1">See how your week went.</p></div><button aria-label="Close" class="w-11 h-11 flex items-center justify-center rounded-lg text-on-surface hover:bg-surface-container-high/60 transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">close</span></button></div></header><main class="flex flex-col relative w-full pt-16 bg-surface px-margin-mobile pb-safe flex-1"><div class="flex flex-col w-full pb-space-xl"><div class="flex items-center gap-space-sm overflow-x-auto pt-space-sm pb-space-sm scrollbar-none" id="weekSelector"><button class="week-chip whitespace-nowrap px-space-md py-space-xs rounded-full font-label-md text-label-md transition-all duration-200 bg-primary-fixed text-on-primary-fixed-variant font-medium shadow-sm" type="button">This week</button><button class="week-chip whitespace-nowrap px-space-md py-space-xs rounded-full font-label-md text-label-md transition-all duration-200 bg-surface-container text-on-surface-variant hover:bg-surface-container-high" type="button">Sep 15–21</button><button class="week-chip whitespace-nowrap px-space-md py-space-xs rounded-full font-label-md text-label-md transition-all duration-200 bg-surface-container text-on-surface-variant hover:bg-surface-container-high" type="button">Sep 8–14</button></div><section class="mt-space-md mb-space-lg"><div class="flex items-center justify-between mb-space-sm"><h2 class="font-label-lg text-label-lg font-semibold text-on-surface">This week</h2></div><div class="grid grid-cols-2 gap-space-md"><div class="flex flex-col p-space-md rounded-xl bg-surface-container-lowest shadow-sm"><span class="font-label-sm text-label-sm text-on-surface-variant mb-space-xs">Focus</span><p class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">14h 32m</p></div><div class="flex flex-col p-space-md rounded-xl bg-surface-container-lowest shadow-sm"><span class="font-label-sm text-label-sm text-on-surface-variant mb-space-xs">Tasks</span><p class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">32</p></div><div class="flex flex-col p-space-md rounded-xl bg-surface-container-lowest shadow-sm"><span class="font-label-sm text-label-sm text-on-surface-variant mb-space-xs">Habits</span><p class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">82%</p></div><div class="flex flex-col p-space-md rounded-xl bg-surface-container-lowest shadow-sm"><span class="font-label-sm text-label-sm text-on-surface-variant mb-space-xs">Energy</span><p class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">7.2</p></div><div class="flex flex-col p-space-md rounded-xl bg-surface-container-lowest shadow-sm col-span-2"><span class="font-label-sm text-label-sm text-on-surface-variant mb-space-xs">Entries</span><p class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">5</p></div></div></section><section class="mb-space-lg"><div class="flex items-center justify-between mb-space-sm"><h2 class="font-label-lg text-label-lg font-semibold text-on-surface">Reflection</h2></div><div class="rounded-xl bg-surface-container-lowest p-space-md shadow-sm"><p class="font-body-md text-body-md text-on-surface leading-relaxed">You spent most of your time on development and study this week. Your focus was strongest in the afternoon. Sleep patterns stayed steady.</p></div></section><button class="w-full py-space-sm px-space-md rounded-[14px] bg-primary text-on-primary font-label-lg text-label-lg font-medium flex items-center justify-center gap-space-xs shadow-sm hover:opacity-95 active:scale-[0.99] transition-all" id="generateReflectionBtn" type="button"><span class="material-symbols-outlined text-[18px]">auto_awesome</span><span class="">Generate reflection</span></button></div>
<script>
  (function() {
    // Week chip selector micro-interaction
    const weekChips = document.querySelectorAll('.week-chip');
    weekChips.forEach(chip => {
      chip.addEventListener('click', () => {
        weekChips.forEach(c => {
          c.classList.remove('bg-primary-fixed', 'text-on-primary-fixed-variant', 'font-medium', 'shadow-sm');
          c.classList.add('bg-surface-container', 'text-on-surface-variant');
        });
        chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
        chip.classList.add('bg-primary-fixed', 'text-on-primary-fixed-variant', 'font-medium', 'shadow-sm');
      });
    });

    // Reflection lens pill selector micro-interaction
    const lensTabs = document.querySelectorAll('.lens-tab');
    const standoutP = document.getElementById('reflectionStandout');
    const thoughtP = document.getElementById('reflectionThought');

    const lensContent = {
      summary: {
        standout: "Your focus was strongest earlier in the week, especially on Tuesday morning. Your reading habit also stayed steady.",
        thought: "Protect the quieter hours of your morning for the work that needs your full attention."
      },
      deeper: {
        standout: "Midweek energy dipped slightly as meeting volume rose. You naturally regained calm rhythm through evening quiet walks and offline reading.",
        thought: "Notice when ambient noise begins to crowd your headspace, and step away before fatigue sets in."
      },
      'next-steps': {
        standout: "Task flow peaked when sessions were capped at 45 minutes. Late afternoon tasks lingered incomplete more frequently.",
        thought: "Schedule high-clarity writing blocks before 11:00 AM on Monday and Thursday."
      }
    };

    lensTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        lensTabs.forEach(t => {
          t.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
          t.classList.add('text-on-surface-variant');
        });
        tab.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
        tab.classList.remove('text-on-surface-variant');

        const key = tab.dataset.lens;
        if (lensContent[key] && standoutP && thoughtP) {
          standoutP.textContent = lensContent[key].standout;
          thoughtP.textContent = lensContent[key].thought;
        }
      });
    });

    // Toast helper
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    function showToast(msg) {
      if (!toast || !toastMsg) return;
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2200);
    }

    // Copy action
    const copyBtn = document.getElementById('copyBtn');
    const copyText = document.getElementById('copyText');
    const copyIcon = document.getElementById('copyIcon');
    if (copyBtn && copyText && copyIcon) {
      copyBtn.addEventListener('click', () => {
        const text = `${standoutP ? standoutP.innerText : ''}\n\n${thoughtP ? thoughtP.innerText : ''}`;
        navigator.clipboard?.writeText(text).catch(() => {});
        copyText.textContent = 'Copied';
        copyIcon.textContent = 'check';
        showToast('Reflection copied to clipboard');
        setTimeout(() => {
          copyText.textContent = 'Copy';
          copyIcon.textContent = 'content_copy';
        }, 2000);
      });
    }

    // Save to journal action
    const saveJournalBtn = document.getElementById('saveJournalBtn');
    if (saveJournalBtn) {
      saveJournalBtn.addEventListener('click', () => {
        showToast('Saved to your Calm Journal');
      });
    }

    // Write reflection primary button trigger
    const writeBtn = document.getElementById('writeReflectionBtn');
    if (writeBtn) {
      writeBtn.addEventListener('click', () => {
        showToast('Reflection draft opened');
      });
    }
  })();
</script></main></div>
