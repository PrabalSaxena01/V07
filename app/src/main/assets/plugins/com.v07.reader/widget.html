<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reader Widget</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --text: #F1F5F9;
    --muted: #94A3B8;
    --border: rgba(255, 255, 255, 0.08);
    --bar-bg: rgba(255, 255, 255, 0.08);
    --chip-bg: rgba(255, 255, 255, 0.04);
    --accent: #8D6CFF;
    --accent-light: #A78BFA;
    --accent-glow: rgba(141, 108, 255, 0.15);
  }
  :root[data-theme="light"] {
    --text: #0F172A;
    --muted: #64748B;
    --border: rgba(0, 0, 0, 0.08);
    --bar-bg: rgba(0, 0, 0, 0.08);
    --chip-bg: rgba(0, 0, 0, 0.04);
    --accent: #7C3AED;
    --accent-light: #6D28D9;
    --accent-glow: rgba(124, 58, 237, 0.12);
  }
  body {
    margin: 0;
    padding: 8px 12px 10px;
    background: transparent;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
    width: 100%;
    user-select: none;
  }
  .rw-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  .rw-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .rw-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-light);
    background: var(--accent-glow);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2px 6px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .rw-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.25;
  }
  .rw-author {
    font-size: 10px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rw-bar-track {
    width: 100%;
    height: 5px;
    background: var(--bar-bg);
    border-radius: 3px;
    overflow: hidden;
  }
  .rw-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.35s ease;
  }
  .rw-chips {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
  }
  .rw-chip {
    flex: 1;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    text-align: center;
    font-size: 9px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rw-chip-val {
    color: var(--text);
    font-weight: 700;
  }
  /* 1-Tap Quick Logger Row */
  .rw-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-top: 1px;
  }
  .btn-step {
    flex: 1;
    min-height: 26px;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 3px 6px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s ease;
  }
  .btn-step:active {
    transform: scale(0.92);
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--accent-light);
  }
  /* Toast feedback */
  .toast {
    position: fixed;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--accent);
    color: #F1F5F9;
    font-size: 9.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
<script>
(function(){
  function syncTheme(){
    var t = 'dark';
    try {
      t = window.parent.document.documentElement.dataset.theme || localStorage.getItem('v07_theme') || 'dark';
    } catch(e){
      try { t = localStorage.getItem('v07_theme') || 'dark'; } catch(e2){}
    }
    if(t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }
  syncTheme();
  window.addEventListener('storage', syncTheme);
})();
</script>
</head>
<body onclick="openPlugin(event)">
<div id="wRoot">
  <div style="font-size:10px;color:var(--muted)">loading library&hellip;</div>
</div>
<div id="toast" class="toast">Reading logged</div>

<script>
var STORAGE_KEY = 'v07_reader_books';

function showToast(msg){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

function getSize(){
  try {
    var s = new URLSearchParams(window.location.search).get('size');
    if(s === 'compact' || s === '1*1') return 'compact';
    if(s === 'small' || s === '2*1') return 'small';
    if(s === 'medium' || s === '3*1') return 'medium';
    if(s === 'large' || s === '4*2') return 'large';
  } catch(e){}
  var h = window.innerHeight;
  if(h > 0 && h <= 85) return 'compact';
  if(h > 85 && h <= 125) return 'small';
  if(h > 125 && h <= 190) return 'medium';
  if(h > 190) return 'large';
  return 'medium';
}

function openPlugin(e){
  if(e && e.target && e.target.closest('.btn-step')) return;
  try {
    if(window.parent && window.parent.openPluginPage){
      window.parent.openPluginPage('com.v07.reader');
      return;
    }
    if(window.parent && window.parent.postMessage){
      window.parent.postMessage({ type: 'v3:plugin:open', pluginId: 'com.v07.reader' }, '*');
      return;
    }
  } catch(e){}
  location.href = 'index.html';
}

function bumpPages(e, delta){
  if(e) e.stopPropagation();
  var books = getBooks();
  var active = books.find(function(b){ return b.shelf === 'reading'; });
  if(!active){
    // If no active book, activate default classic
    active = { id: 'book_meditations', title: 'Meditations', author: 'Marcus Aurelius', pages: 180, currentPage: 0, shelf: 'reading' };
    books.unshift(active);
  }
  var cur = parseInt(active.currentPage, 10) || 0;
  var tot = parseInt(active.pages, 10) || 180;
  active.currentPage = Math.min(tot, Math.max(0, cur + delta));
  if(active.currentPage >= tot){
    active.shelf = 'finished';
  }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
    window.parent.postMessage({ type: 'v07_refresh' }, '*');
  } catch(err){}
  showToast('📖 +' + delta + 'p Logged (' + active.currentPage + '/' + tot + 'p)');
  draw();
}

function getBooks(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  } catch(e){}
  return [
    { id: 'b1', title: 'Meditations', author: 'Marcus Aurelius', pages: 180, currentPage: 42, shelf: 'reading' }
  ];
}

function esc(str){
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

window.addEventListener('resize', draw);
window.addEventListener('message', function(e){
  if(e.data && (e.data.type === 'setSize' || e.data.type === 'v07_refresh')){
    draw();
  }
});

function draw(){
  var root = document.getElementById('wRoot');
  if(!root) return;

  var books = getBooks();
  var active = books.find(function(b){ return b.shelf === 'reading'; }) || books[0];
  var size = getSize();

  var cur = parseInt(active.currentPage, 10) || 0;
  var tot = parseInt(active.pages, 10) || 180;
  var pct = Math.min(100, Math.round((cur / tot) * 100));
  var remaining = Math.max(0, tot - cur);

  if(size === 'compact'){
    root.innerHTML =
      '<div class="rw-wrap" style="cursor:pointer">' +
      '  <div class="rw-head">' +
      '    <div class="rw-badge" style="font-size:9px;padding:1px 5px">📖 ' + pct + '%</div>' +
      '    <div style="font-size:9px;color:var(--accent-light);font-weight:700">' + cur + '/' + tot + 'p</div>' +
      '  </div>' +
      '  <div class="rw-title" style="font-size:11.5px">' + esc(active.title) + '</div>' +
      '  <div class="rw-bar-track"><div class="rw-bar-fill" style="width:' + pct + '%"></div></div>' +
      '</div>';
    return;
  }

  root.innerHTML =
    '<div class="rw-wrap" style="cursor:pointer">' +
    '  <div class="rw-head">' +
    '    <div class="rw-badge">📖 READING CADENCE</div>' +
    '    <div style="font-size:9.5px;color:var(--accent-light);font-weight:700">' + pct + '% (' + remaining + 'p left)</div>' +
    '  </div>' +
    '  <div>' +
    '    <div class="rw-title">' + esc(active.title) + '</div>' +
    '    <div class="rw-author">' + esc(active.author || 'Author') + '</div>' +
    '  </div>' +
    '  <div class="rw-bar-track"><div class="rw-bar-fill" style="width:' + pct + '%"></div></div>' +
    '  <div class="rw-chips">' +
    '    <span class="rw-chip">PAGE <span class="rw-chip-val">' + cur + '/' + tot + '</span></span>' +
    '    <span class="rw-chip">PROGRESS <span class="rw-chip-val">' + pct + '%</span></span>' +
    '    <span class="rw-chip">EST <span class="rw-chip-val">~' + Math.ceil(remaining/15) + 'd</span></span>' +
    '  </div>' +
    '  <div class="rw-footer">' +
    '    <button class="btn-step" onclick="bumpPages(event, 5)">+5p</button>' +
    '    <button class="btn-step" onclick="bumpPages(event, 10)">+10p</button>' +
    '    <button class="btn-step" onclick="bumpPages(event, 25)">+25p</button>' +
    '  </div>' +
    '</div>';
}

draw();
</script>
</body>
</html>
