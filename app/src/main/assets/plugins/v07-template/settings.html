<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Companion Settings</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="plugin.css">
  <script src="v07-sdk.js"></script>
</head>
<body>
  <div class="plugin-container">
    <header class="header-card">
      <div class="header-info">
        <div class="plugin-icon">
          <span class="material-symbols-outlined">tune</span>
        </div>
        <div>
          <h1 class="plugin-title">Companion Settings</h1>
          <span class="plugin-badge">Preferences & Configuration</span>
        </div>
      </div>
      <button onclick="v07.ui.close()" class="btn btn-secondary">
        <span class="material-symbols-outlined" style="font-size: 16px;">close</span>
      </button>
    </header>

    <section class="card">
      <div class="card-title">Options</div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <label style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 12px; font-weight: 600;">Enable Daily Audio Chime</span>
          <input type="checkbox" id="cfg-chime" style="width: 18px; height: 18px;" />
        </label>
        <label style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 12px; font-weight: 600;">Custom Notification Tag</span>
          <input type="text" id="cfg-tag" placeholder="e.g. Daily Mindful Interval" />
        </label>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
        <button onclick="saveSettings()" class="btn btn-primary">Save Settings</button>
      </div>
    </section>
  </div>

  <script>
    async function loadSettings() {
      const chime = await v07.storage.get('cfg_chime');
      if (chime !== null) document.getElementById('cfg-chime').checked = !!chime;

      const tag = await v07.storage.get('cfg_tag');
      if (tag !== null) document.getElementById('cfg-tag').value = tag;
    }

    async function saveSettings() {
      const chime = document.getElementById('cfg-chime').checked;
      const tag = document.getElementById('cfg-tag').value.trim();

      await v07.storage.set('cfg_chime', chime);
      await v07.storage.set('cfg_tag', tag);

      v07.ui.showToast('Settings Saved', 'Companion preferences updated', 'success');
    }

    window.addEventListener('DOMContentLoaded', loadSettings);
  </script>
</body>
</html>
