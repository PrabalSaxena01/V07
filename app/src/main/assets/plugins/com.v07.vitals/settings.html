<!DOCTYPE html>
<html lang="en">
<head>
<script src="v07-sdk.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vitals Settings</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #090909; --surface: #111319; --surface-low: #1D2025; --border: #2C2C2C;
    --text: #E1E2EA; --muted: #8A8F98; --accent: #4DE086;
  }
  :root[data-theme="light"] {
    --bg: #f0f0f2; --surface: #ffffff; --surface-low: #f5f5f7; --border: #d0d0d5;
    --text: #1a1a2e; --muted: #666666; --accent: #1a8a5a;
  }
  body {
    background: var(--bg); color: var(--text); padding: 14px;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 12px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; margin-bottom: 12px;
  }
  .card-title {
    font-size: 10px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .widget-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .pill-btn {
    flex: 1; min-width: 55px; background: var(--surface-low); border: 1px solid var(--border);
    color: var(--muted); padding: 6px 4px; border-radius: 4px; font-family: inherit;
    font-size: 10px; font-weight: 700; cursor: pointer; text-align: center;
  }
  .pill-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }
  .field { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  input[type="time"], input[type="text"], select {
    background: var(--surface-low); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 5px 8px; font-family: inherit; font-size: 11px;
  }
  .btn-action {
    background: var(--accent); color: #000; border: none; border-radius: 4px;
    padding: 7px 12px; font-family: inherit; font-size: 10px; font-weight: 700;
    cursor: pointer; text-transform: uppercase;
  }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #111; color: var(--accent); border: 1px solid var(--accent);
    padding: 8px 16px; border-radius: 6px; font-size: 11px; font-weight: 700;
    z-index: 999; opacity: 0; transition: all 0.2s ease;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
<script>
(function(){
  function syncTheme(){
    var t = 'dark';
    try {
      t = window.parent.document.documentElement.dataset.theme || localStorage.getItem('v07_theme') || 'dark';
    } catch(e){
      try { t = localStorage.getItem('v07_theme') || 'dark'; } catch(e2){}
    }
    if(t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }
  syncTheme();
  window.addEventListener('storage', syncTheme);
})();
</script>
</head>
<body>

<div class="card">
  <div class="card-title">✦ HOME DASHBOARD WIDGET</div>
  <p style="font-size:11px;color:var(--muted);margin-bottom:8px">
    Choose the Mood &amp; Energy widget size displayed on your Home dashboard:
  </p>
  <div class="widget-pills">
    <button class="pill-btn" data-size="compact" onclick="setWidgetSize('compact')">COMPACT (1x1)</button>
    <button class="pill-btn" data-size="small" onclick="setWidgetSize('small')">SMALL (2x1)</button>
    <button class="pill-btn" data-size="medium" onclick="setWidgetSize('medium')">MEDIUM (3x1)</button>
    <button class="pill-btn" data-size="large" onclick="setWidgetSize('large')">LARGE (4x2)</button>
    <button class="pill-btn" data-size="hidden" onclick="setWidgetSize('hidden')">HIDE / OFF</button>
  </div>
</div>

<div class="card">
  <div class="card-title">🔔 DAILY VITALS CHECK-IN NOTIFICATION</div>
  <div class="field">
    <span>Enable Daily Reminder</span>
    <input type="checkbox" id="notifToggle" onchange="saveNotifSettings()">
  </div>
  <div class="field">
    <span>Reminder Time</span>
    <input type="time" id="notifTime" value="14:00" onchange="saveNotifSettings()">
  </div>
  <div class="field">
    <span>Title</span>
    <input type="text" id="notifTitle" value="Vitals Check-in" style="width:160px" onchange="saveNotifSettings()">
  </div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn-action" onclick="testNotif()" style="flex:1">TEST NOTIFICATION</button>
    <button class="btn-action" onclick="saveNotifSettings()" style="flex:1;background:var(--surface-low);color:var(--text);border:1px solid var(--border)">SAVE SCHEDULE</button>
  </div>
</div>

<div class="card">
  <div class="card-title">✦ VITALS PREFERENCES</div>
  <div class="field">
    <span>Rating Scale</span>
    <select id="prefRatingScale">
      <option value="5" selected>1-5 Rating</option>
      <option value="10">1-10 Slider</option>
    </select>
  </div>
  <label style="display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;margin-bottom:8px">
    <input type="checkbox" id="prefTrackCombined" checked> Track Mood &amp; Energy together
  </label>
  <label style="display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer">
    <input type="checkbox" id="prefMiddayPrompt" checked> Prompt during afternoon dip (14:00)
  </label>
</div>

<div class="toast" id="toast">Saved</div>

<script>
var PLUGIN_ID = 'com.v07.vitals';
var SETTINGS_KEY = 'v07_plugin_settings_' + PLUGIN_ID;

function getSettings(){
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); } catch(e){ return {}; }
}
function saveSettings(s){
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
    window.dispatchEvent(new Event('storage'));
  } catch(e){}
}

function loadUI(){
  var s = getSettings();
  var sz = s.widgetSize || 'medium';
  document.querySelectorAll('.pill-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.size === sz);
  });
  document.getElementById('notifToggle').checked = s.notifEnabled !== false;
  document.getElementById('notifTime').value = s.notifTime || '14:00';
  document.getElementById('notifTitle').value = s.notifTitle || 'Vitals Check-in';

  var scale = document.getElementById('prefRatingScale');
  var comb = document.getElementById('prefTrackCombined');
  var mid = document.getElementById('prefMiddayPrompt');
  scale.value = localStorage.getItem('vitals_scale') || '5';
  comb.checked = localStorage.getItem('vitals_combined') !== 'false';
  mid.checked = localStorage.getItem('vitals_midday_prompt') !== 'false';
  scale.onchange = function(){ localStorage.setItem('vitals_scale', scale.value); };
  comb.onchange = function(){ localStorage.setItem('vitals_combined', comb.checked); };
  mid.onchange = function(){ localStorage.setItem('vitals_midday_prompt', mid.checked); };
}

function setWidgetSize(sz){
  var s = getSettings();
  s.widgetSize = sz;
  saveSettings(s);
  document.querySelectorAll('.pill-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.size === sz);
  });
  if(window.parent && window.parent.postMessage){
    window.parent.postMessage({ type: 'setPluginWidgetSize', pluginId: PLUGIN_ID, size: sz }, '*');
  }
  toast('Widget set to: ' + sz.toUpperCase());
}

function saveNotifSettings(){
  var s = getSettings();
  s.notifEnabled = document.getElementById('notifToggle').checked;
  s.notifTime = document.getElementById('notifTime').value || '14:00';
  s.notifTitle = document.getElementById('notifTitle').value || 'Vitals Check-in';
  saveSettings(s);

  if(s.notifEnabled){
    var parts = s.notifTime.split(':');
    var th = parseInt(parts[0], 10) || 14;
    var tm = parseInt(parts[1], 10) || 0;
    var now = new Date();
    var target = new Date();
    target.setHours(th, tm, 0, 0);
    if(target.getTime() <= now.getTime()) target.setDate(target.getDate() + 1);
    var delayMs = target.getTime() - now.getTime();

    var bridge = (window.parent && window.parent.AndroidV07) || window.AndroidV07;
    if(bridge && bridge.call){
      var res = bridge.call('scheduleReminder', JSON.stringify({
        pluginId: PLUGIN_ID,
        title: s.notifTitle,
        body: 'How is your mood and energy level right now?',
        delayMs: delayMs,
        id: 'daily'
      }));
      if(res){
        var parsed = typeof res === 'string' ? JSON.parse(res) : res;
        if(parsed && parsed.ok === false){
          toast(parsed.error || 'Failed to schedule reminder');
          return;
        }
      }
      toast('Reminder scheduled for ' + s.notifTime);
    } else {
      toast('Notification bridge unavailable');
    }
  } else {
    var bridge = (window.parent && window.parent.AndroidV07) || window.AndroidV07;
    if(bridge && bridge.call){
      bridge.call('cancelReminder', JSON.stringify({ pluginId: PLUGIN_ID, id: 'daily' }));
    }
    toast('Reminder disabled');
  }
}

function testNotif(){
  var title = document.getElementById('notifTitle').value || 'Vitals Check-in';
  try {
    var bridge = (window.parent && window.parent.AndroidV07) || window.AndroidV07;
    if(bridge && bridge.call){
      var res = bridge.call('scheduleReminder', JSON.stringify({
        pluginId: PLUGIN_ID,
        title: title,
        body: 'How is your mood and energy level right now?',
        delayMs: 0,
        id: 'test_' + Date.now()
      }));
      if(res){
        var parsed = typeof res === 'string' ? JSON.parse(res) : res;
        if(parsed && parsed.ok === false){
          toast(parsed.error || 'Failed to send notification');
          return;
        }
      }
      toast('Test notification sent');
      return;
    }
    toast('Notification bridge unavailable in browser mode');
  } catch(e){
    toast('Failed: ' + (e.message || e));
  }
}

function toast(msg){
  var el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

loadUI();
</script>
</body>
</html>
