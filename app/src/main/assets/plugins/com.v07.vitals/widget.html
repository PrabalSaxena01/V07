<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vitals Widget</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --text: #F1F5F9;
    --muted: #94A3B8;
    --border: #262C3E;
    --bar-bg: rgba(255,255,255,0.08);
    --chip-bg: rgba(255,255,255,0.04);
    --chip-border: rgba(255,255,255,0.08);
    --primary: #4DE086;
    --primary-glow: rgba(77,224,134,0.15);
  }
  :root[data-theme="light"] {
    --text: #0F172A;
    --muted: #64748B;
    --border: #CBD5E1;
    --bar-bg: rgba(0,0,0,0.08);
    --chip-bg: rgba(0,0,0,0.04);
    --chip-border: rgba(0,0,0,0.08);
    --primary: #16A34A;
    --primary-glow: rgba(22,163,74,0.12);
  }
  body {
    margin: 0;
    padding: 8px 12px 10px;
    background: transparent;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
    width: 100%;
    cursor: pointer;
    user-select: none;
  }
  .gw-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  .gw-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .gw-lvl-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gw-badge {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--primary);
    background: var(--primary-glow);
    border: 1px solid var(--primary);
    border-radius: 4px;
    padding: 2px 6px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .gw-rank {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .gw-total {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
  }
  .gw-chips {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .gw-chip {
    font-size: 9px;
    color: var(--muted);
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 4px;
    padding: 3px 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .gw-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: inline-block;
  }
  .gw-dot.on {
    background: var(--primary);
    box-shadow: 0 0 5px var(--primary);
  }
  .gw-dot.off {
    background: var(--muted);
  }
  .gw-chip-val {
    color: var(--text);
    font-weight: 700;
  }
</style>
<script>
(function(){
  function syncTheme(){
    var t = 'dark';
    try {
      t = window.parent.document.documentElement.dataset.theme || localStorage.getItem('v07_theme') || 'dark';
    } catch(e){
      try { t = localStorage.getItem('v07_theme') || 'dark'; } catch(e2){}
    }
    if(t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }
  syncTheme();
  window.addEventListener('storage', syncTheme);
})();
</script>
</head>
<body>
<div id="w"></div>
<script>
function esc(t){
  return (t || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function openVitalsPlugin(){
  try {
    if(window.parent && window.parent.openPluginPage){
      window.parent.openPluginPage('com.v07.vitals');
      return;
    }
  } catch(e){}
  location.href = 'index.html';
}

function getSize(){
  try {
    var s = new URLSearchParams(window.location.search).get('size');
    if(s === 'compact' || s === '1*1') return 'compact';
    if(s === 'small' || s === '2*1') return 'small';
    if(s === 'medium' || s === '3*1') return 'medium';
    if(s === 'large' || s === '4*2') return 'large';
  } catch(e){}
  var h = window.innerHeight;
  if(h > 0 && h <= 85) return 'compact';
  if(h > 85 && h <= 125) return 'small';
  if(h > 125 && h <= 190) return 'medium';
  if(h > 190) return 'large';
  return 'medium';
}

window.addEventListener('resize', draw);
window.addEventListener('message', function(e){
  if(e.data && (e.data.type === 'setSize' || e.data.type === 'v07_refresh')){
    draw();
  }
});

function draw(){
  var el = document.getElementById('w');
  if(!el) return;
  var size = getSize();

  Promise.allSettled([
    fetch('/events/mood/today').then(function(r){ return r.json(); }),
    fetch('/events/energy/today').then(function(r){ return r.json(); })
  ]).then(function(results){
    var moodData = results[0].status === 'fulfilled' ? results[0].value : null;
    var energyData = results[1].status === 'fulfilled' ? results[1].value : null;

    var moodEv = (moodData && moodData.events && moodData.events[0]) || null;
    var energyEv = (energyData && energyData.events && energyData.events[0]) || null;

    var moodLabel = moodEv ? (moodEv.label || moodEv.mood || 'LOGGED') : '--';
    var energyVal = energyEv ? energyEv.energy : 0;
    var energyLabel = energyEv ? (energyEv.energy + '/5') : '--';

    if(size === 'compact'){
      el.innerHTML =
        '<div class="gw-wrap" onclick="openVitalsPlugin()" style="cursor:pointer">' +
        '  <div class="gw-row1">' +
        '    <span class="gw-badge">⚡ VITALS</span>' +
        '    <span class="gw-rank">' + (energyEv ? 'E: ' + energyLabel : 'LOGGED') + '</span>' +
        '  </div>' +
        '  <div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0">' +
        '    <span style="font-size:12px;font-weight:700;color:var(--text)">' + moodLabel.toUpperCase() + '</span>' +
        '    <span style="font-size:9px;color:var(--muted)">' + (energyEv ? 'ENERGY ' + energyLabel : 'TAP TO LOG') + '</span>' +
        '  </div>' +
        '  <div style="width:100%;height:4px;background:var(--bar-bg);border-radius:2px;overflow:hidden">' +
        '    <div style="height:100%;background:var(--primary);border-radius:2px;width:' + (energyVal * 20) + '%"></div>' +
        '  </div>' +
        '</div>';
      return;
    }

    if(size === 'small'){
      el.innerHTML =
        '<div class="gw-wrap" onclick="openVitalsPlugin()" style="cursor:pointer">' +
        '  <div class="gw-row1">' +
        '    <div class="gw-lvl-group">' +
        '      <span class="gw-badge">⚡ VITALS</span>' +
        '      <span class="gw-rank">DAILY STATE</span>' +
        '    </div>' +
        '    <span class="gw-total">' + moodLabel.toUpperCase() + '</span>' +
        '  </div>' +
        '  <div class="gw-chips" style="margin-top:4px">' +
        '    <span class="gw-chip"><span class="gw-dot ' + (moodEv?'on':'off') + '"></span> MOOD ' + moodLabel + '</span>' +
        '    <span class="gw-chip">ENERGY <span class="gw-chip-val">' + energyLabel + '</span></span>' +
        '  </div>' +
        '</div>';
      return;
    }

    if(size === 'medium'){
      el.innerHTML =
        '<div class="gw-wrap" onclick="openVitalsPlugin()" style="cursor:pointer">' +
        '  <div class="gw-row1">' +
        '    <div class="gw-lvl-group">' +
        '      <span class="gw-badge">⚡ MOOD &amp; ENERGY</span>' +
        '      <span class="gw-rank">DAILY CHECK-IN</span>' +
        '    </div>' +
        '    <span class="gw-total">' + moodLabel.toUpperCase() + '</span>' +
        '  </div>' +
        '  <div class="gw-chips" style="margin-top:6px">' +
        '    <span class="gw-chip"><span class="gw-dot ' + (moodEv?'on':'off') + '"></span> MOOD <span class="gw-chip-val">' + moodLabel + '</span></span>' +
        '    <span class="gw-chip">ENERGY <span class="gw-chip-val">' + energyLabel + '</span></span>' +
        '    <span class="gw-chip" onclick="openVitalsPlugin()">LOG &rsaquo;</span>' +
        '  </div>' +
        '</div>';
      return;
    }

    // Large (250px)
    var noteSnippet = (moodEv && moodEv.note) ? esc(moodEv.note) : 'No vitals journal note entered today.';
    var energyDots = '';
    for(var i = 1; i <= 5; i++){
      energyDots += '<span style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;background:' + (i <= energyVal ? 'var(--primary)' : 'var(--bar-bg)') + '"></span>';
    }
    el.innerHTML =
      '<div class="gw-wrap" onclick="openVitalsPlugin()" style="cursor:pointer">' +
      '  <div class="gw-row1">' +
      '    <div class="gw-lvl-group">' +
      '      <span class="gw-badge" style="font-size:11px;padding:3px 7px">⚡ VITALS · STATE</span>' +
      '      <span class="gw-rank">DAILY SPECTRUM</span>' +
      '    </div>' +
      '    <span class="gw-total" style="font-size:15px">' + moodLabel.toUpperCase() + '</span>' +
      '  </div>' +
      '  <div style="display:flex;align-items:center;justify-content:space-between;margin:6px 0">' +
      '    <div style="font-size:9.5px;color:var(--muted)">ENERGY LEVEL:</div>' +
      '    <div style="display:flex;align-items:center">' + energyDots + ' <span style="font-size:10px;font-weight:700;margin-left:4px">' + energyLabel + '</span></div>' +
      '  </div>' +
      '  <div style="background:var(--chip-bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:6px">' +
      '    <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px">Journal Note</div>' +
      '    <div style="font-size:11px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + noteSnippet + '</div>' +
      '  </div>' +
      '  <div class="gw-chips">' +
      '    <span class="gw-chip"><span class="gw-dot ' + (moodEv?'on':'off') + '"></span> ' + (moodEv ? 'CHECKED IN' : 'DUE TODAY') + '</span>' +
      '    <span class="gw-chip" onclick="openVitalsPlugin()">OPEN VITALS &rsaquo;</span>' +
      '  </div>' +
      '</div>';
  }).catch(function(){
    el.innerHTML = '<div style="font-size:10px;color:var(--muted)">Loading vitals...</div>';
  });
}
draw();
setInterval(draw, 30000);
</script>
</body>
</html>
