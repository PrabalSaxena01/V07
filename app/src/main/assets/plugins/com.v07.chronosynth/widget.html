<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Focus Sanctuary Widget</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --text: #F1F5F9;
    --muted: #94A3B8;
    --border: #262C3E;
    --bar-bg: rgba(255,255,255,0.08);
    --chip-bg: rgba(255,255,255,0.04);
    --chip-border: rgba(255,255,255,0.08);
    --teal: #14B8A6;
    --teal-glow: rgba(20, 184, 166, 0.2);
    --surface: #0E1420;
  }
  :root[data-theme="light"] {
    --text: #0F172A;
    --muted: #64748B;
    --border: #CBD5E1;
    --bar-bg: rgba(0,0,0,0.08);
    --chip-bg: rgba(0,0,0,0.04);
    --chip-border: rgba(0,0,0,0.08);
    --teal: #0D9488;
    --teal-glow: rgba(13, 148, 136, 0.15);
    --surface: #F8FAFC;
  }
  body {
    margin: 0;
    padding: 10px 12px;
    background: transparent;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
    width: 100%;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .cs-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }
  .cs-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cs-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    color: var(--teal);
    background: var(--teal-glow);
    border: 1px solid var(--teal);
    border-radius: 4px;
    padding: 2px 6px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .cs-status {
    font-size: 9.5px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .cs-gauge-container {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 4px 0;
  }
  .cs-gauge-svg {
    transform: rotate(-90deg);
  }
  .cs-digits-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .cs-digits {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .cs-mode-lbl {
    font-size: 8px;
    font-weight: 700;
    color: var(--teal);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 3px;
  }
  .cs-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 2px;
  }
  .cs-btn {
    border: 1px solid var(--border);
    background: var(--chip-bg);
    color: var(--text);
    font-size: 10px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .cs-btn:active {
    transform: scale(0.96);
  }
  .cs-btn.primary {
    background: var(--teal);
    color: #FFFFFF;
    border-color: var(--teal);
    font-weight: 700;
  }
  .cs-quick-log {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    border-radius: 6px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    font-size: 9.5px;
    color: var(--muted);
  }
  .cs-quick-log button {
    background: var(--teal);
    color: #FFFFFF;
    border: none;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    padding: 3px 8px;
    cursor: pointer;
  }
</style>
<script>
(function(){
  function syncTheme(){
    var t = 'dark';
    try { t = window.parent.document.documentElement.dataset.theme || localStorage.getItem('v07_theme') || 'dark'; } catch(e){}
    if(t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }
  syncTheme();
  window.addEventListener('storage', syncTheme);
})();
</script>
</head>
<body>
<div class="cs-wrap" id="app">
  <div class="cs-header">
    <span class="cs-badge">⏳ Focus Sanctuary</span>
    <span class="cs-status" id="chronoStatus">Ready</span>
  </div>

  <!-- Circular Timer Ring -->
  <div class="cs-gauge-container" onclick="openFocusApp()">
    <svg class="cs-gauge-svg" width="108" height="108" viewBox="0 0 108 108">
      <circle cx="54" cy="54" r="45" stroke="var(--bar-bg)" stroke-width="7" fill="none" />
      <circle id="ringProgress" cx="54" cy="54" r="45" stroke="var(--teal)" stroke-width="7" stroke-linecap="round" fill="none"
              stroke-dasharray="282.7" stroke-dashoffset="0" style="transition: stroke-dashoffset 0.4s ease;" />
    </svg>
    <div class="cs-digits-overlay">
      <div class="cs-digits" id="timeDigits">25:00</div>
      <div class="cs-mode-lbl" id="targetLabel">25m Target</div>
    </div>
  </div>

  <!-- Presets & Quick Action Controls -->
  <div class="cs-controls">
    <button class="cs-btn" onclick="setPreset(15)">15m</button>
    <button class="cs-btn primary" id="toggleBtn" onclick="toggleFlow()">Begin Flow</button>
    <button class="cs-btn" onclick="setPreset(45)">45m</button>
  </div>

  <!-- Quick Data Logging -->
  <div class="cs-quick-log">
    <span>Quick Log: Completed 25m Focus</span>
    <button onclick="logQuickSession(25)">+ Log</button>
  </div>
</div>

<script>
var targetSec = 25 * 60;
var remainingSec = 25 * 60;
var isRunning = false;
var timerInterval = null;
var CIRCUMFERENCE = 282.7;

function updateGauge() {
  var fraction = Math.max(0, Math.min(1, remainingSec / targetSec));
  var offset = CIRCUMFERENCE * (1 - fraction);
  var ring = document.getElementById('ringProgress');
  if (ring) ring.style.strokeDashoffset = offset;

  var mins = Math.floor(remainingSec / 60);
  var secs = remainingSec % 60;
  var display = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
  var digitsEl = document.getElementById('timeDigits');
  if (digitsEl) digitsEl.textContent = display;
}

function setPreset(mins) {
  if (isRunning) toggleFlow();
  targetSec = mins * 60;
  remainingSec = targetSec;
  document.getElementById('targetLabel').textContent = mins + 'm Target';
  updateGauge();
}

function toggleFlow() {
  isRunning = !isRunning;
  var btn = document.getElementById('toggleBtn');
  var status = document.getElementById('chronoStatus');
  if (isRunning) {
    btn.textContent = 'Pause';
    btn.style.background = '#F59E0B';
    btn.style.borderColor = '#F59E0B';
    status.textContent = 'Flow Active';
    status.style.color = '#14B8A6';
    timerInterval = setInterval(function() {
      if (remainingSec > 0) {
        remainingSec--;
        updateGauge();
      } else {
        clearInterval(timerInterval);
        isRunning = false;
        btn.textContent = 'Completed!';
        btn.style.background = '#14B8A6';
        status.textContent = 'Complete';
        logQuickSession(Math.round(targetSec / 60));
      }
    }, 1000);
  } else {
    clearInterval(timerInterval);
    btn.textContent = 'Resume';
    btn.style.background = '#14B8A6';
    btn.style.borderColor = '#14B8A6';
    status.textContent = 'Paused';
  }
}

function logQuickSession(durationMins) {
  var durationSec = durationMins * 60;
  var payload = {
    activity: "Focus Flow",
    durationSec: durationSec,
    notes: "Logged from Focus Widget"
  };

  try {
    if (window.parent && window.parent.V07Platform && window.parent.V07Platform.callBridge) {
      window.parent.V07Platform.callBridge('sessions:insert', payload);
      alert('Logged ' + durationMins + 'm session to Sanctuary database!');
      return;
    }
  } catch(e){}

  fetch('/api/v3/sessions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function() {
    alert('Logged ' + durationMins + 'm session to Sanctuary database!');
  }).catch(function() {
    alert('Logged session locally.');
  });
}

function openFocusApp() {
  try {
    if (window.parent && window.parent.openPluginPage) {
      window.parent.openPluginPage('com.v07.chronosynth');
      return;
    }
  } catch(e){}
  location.href = 'index.html';
}

updateGauge();
</script>
</body>
</html>
