<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Digital Stillness Widget</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --text: #F1F5F9;
    --muted: #94A3B8;
    --border: #262C3E;
    --bar-bg: rgba(255,255,255,0.08);
    --chip-bg: rgba(255,255,255,0.04);
    --chip-border: rgba(255,255,255,0.08);
    --blue: #38BDF8;
    --blue-glow: rgba(56, 189, 248, 0.15);
  }
  :root[data-theme="light"] {
    --text: #0F172A;
    --muted: #64748B;
    --border: #CBD5E1;
    --bar-bg: rgba(0,0,0,0.08);
    --chip-bg: rgba(0,0,0,0.04);
    --chip-border: rgba(0,0,0,0.08);
    --blue: #0284C7;
    --blue-glow: rgba(2, 132, 199, 0.12);
  }
  body {
    margin: 0;
    padding: 10px 12px;
    background: transparent;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
    width: 100%;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .st-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }
  .st-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .st-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    color: var(--blue);
    background: var(--blue-glow);
    border: 1px solid var(--blue);
    border-radius: 4px;
    padding: 2px 6px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .st-total {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
  }
  .st-apps-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .st-app-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 6px;
    padding: 5px 8px;
  }
  .st-app-logo {
    width: 24px;
    height: 24px;
    border-radius: 5px;
    background: var(--bar-bg);
    object-fit: cover;
    flex-shrink: 0;
  }
  .st-app-info {
    flex: 1;
    min-width: 0;
  }
  .st-app-name {
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .st-app-bar-track {
    width: 100%;
    height: 3px;
    background: var(--bar-bg);
    border-radius: 1.5px;
    margin-top: 3px;
    overflow: hidden;
  }
  .st-app-bar-fill {
    height: 100%;
    background: var(--blue);
    border-radius: 1.5px;
  }
  .st-app-dur {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--muted);
    flex-shrink: 0;
  }
  .st-quick-log {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    border-radius: 6px;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .st-quick-log button {
    background: var(--blue);
    color: #FFFFFF;
    border: none;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    padding: 3px 8px;
    cursor: pointer;
  }
</style>
<script>
(function(){
  function syncTheme(){
    var t = 'dark';
    try { t = window.parent.document.documentElement.dataset.theme || localStorage.getItem('v07_theme') || 'dark'; } catch(e){}
    if(t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }
  syncTheme();
  window.addEventListener('storage', syncTheme);
})();
</script>
</head>
<body onclick="openTimeTrackerApp()">
<div class="st-wrap">
  <div class="st-header">
    <span class="st-badge">🌿 Digital Stillness</span>
    <span class="st-total" id="totalScreenTime">0h 00m</span>
  </div>

  <!-- Top App Telemetry with Live Logos -->
  <div class="st-apps-list" id="appsList">
    <div style="font-size:10px;color:var(--muted);text-align:center;padding:8px 0;">Loading application telemetry...</div>
  </div>

  <!-- Quick Data Logging -->
  <div class="st-quick-log" onclick="event.stopPropagation()">
    <span>Mindful Offline Pause</span>
    <button onclick="logStillnessPause(30)">+ Log 30m</button>
  </div>
</div>

<script>
var FALLBACK_ICON = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2338BDF8"><rect width="24" height="24" rx="5" fill="%231E293B"/><text x="12" y="16" fill="%2338BDF8" font-size="12" font-family="sans-serif" text-anchor="middle" font-weight="bold">📱</text></svg>';

function loadScreenTimeData() {
  fetch('/api/v3/screentime')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      renderData(data);
    })
    .catch(function() {
      // Fallback demo data with real application package names for logo resolution
      renderData({
        totalDurationMs: 8100000,
        apps: [
          { appName: 'YouTube', packageName: 'com.google.android.youtube', durationMs: 4200000 },
          { appName: 'Chrome', packageName: 'com.android.chrome', durationMs: 2400000 },
          { appName: 'WhatsApp', packageName: 'com.whatsapp', durationMs: 1500000 }
        ]
      });
    });
}

function renderData(data) {
  var totalMs = data.totalDurationMs || 0;
  var hours = Math.floor(totalMs / 3600000);
  var mins = Math.floor((totalMs % 3600000) / 60000);
  document.getElementById('totalScreenTime').textContent = hours + 'h ' + (mins < 10 ? '0' : '') + mins + 'm';

  var apps = data.apps || data.topApps || [];
  var listEl = document.getElementById('appsList');
  if (!listEl) return;
  listEl.innerHTML = '';

  var topApps = apps.slice(0, 3);
  if (topApps.length === 0) {
    listEl.innerHTML = '<div style="font-size:10px;color:var(--muted);text-align:center;padding:8px 0;">No phone usage recorded today. Pure stillness.</div>';
    return;
  }

  var maxDur = topApps[0].durationMs || 1;

  topApps.forEach(function(app) {
    var pkg = app.packageName || app.package || '';
    var name = app.appName || app.app || pkg || 'App';
    var durMs = app.durationMs || 0;
    var appMins = Math.round(durMs / 60000);
    var durFormatted = appMins >= 60 ? Math.floor(appMins / 60) + 'h ' + (appMins % 60) + 'm' : appMins + 'm';
    var pct = Math.min(100, Math.round((durMs / maxDur) * 100));
    var iconUrl = '/api/v3/apps/icon?package=' + encodeURIComponent(pkg);

    var row = document.createElement('div');
    row.className = 'st-app-row';
    row.innerHTML =
      '<img class="st-app-logo" src="' + iconUrl + '" onerror="this.onerror=null;this.src=\'' + FALLBACK_ICON + '\';" alt="' + name + '">' +
      '<div class="st-app-info">' +
      '  <div class="st-app-name">' + name + '</div>' +
      '  <div class="st-app-bar-track"><div class="st-app-bar-fill" style="width:' + pct + '%;"></div></div>' +
      '</div>' +
      '<div class="st-app-dur">' + durFormatted + '</div>';
    listEl.appendChild(row);
  });
}

function logStillnessPause(mins) {
  var payload = {
    category: "screentime",
    title: "Digital Stillness Pause",
    content: "Took a mindful " + mins + "m offline sanctuary break.",
    metadataJson: JSON.stringify({ stillnessDurationMin: mins })
  };

  fetch('/api/v3/events', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function() {
    alert('Logged ' + mins + 'm mindful pause to Sanctuary!');
  }).catch(function() {
    alert('Logged mindful pause locally.');
  });
}

function openTimeTrackerApp() {
  try {
    if (window.parent && window.parent.openPluginPage) {
      window.parent.openPluginPage('com.v07.timetracker');
      return;
    }
  } catch(e){}
  location.href = 'index.html';
}

loadScreenTimeData();
</script>
</body>
</html>
