<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Running Widget</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --text: #F1F5F9;
    --muted: #94A3B8;
    --bar-bg: rgba(255, 255, 255, 0.08);
    --chip-bg: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.08);
    --accent: #10B981;
    --accent-glow: rgba(16, 185, 129, 0.15);
  }
  :root[data-theme="light"], html.light, body.light, .light {
    --text: #0F172A;
    --muted: #64748B;
    --bar-bg: rgba(0, 0, 0, 0.08);
    --chip-bg: rgba(0, 0, 0, 0.04);
    --border: rgba(0, 0, 0, 0.08);
    --accent: #059669;
    --accent-glow: rgba(5, 150, 105, 0.12);
  }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: transparent;
    color: var(--text);
    padding: 8px 12px 10px;
    overflow: hidden;
    width: 100%;
    user-select: none;
  }
  .rw-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  .rw-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .rw-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-glow);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2px 6px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .rw-stat {
    font-size: 9px;
    color: var(--accent);
    background: var(--accent-glow);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2px 6px;
    font-weight: 700;
  }
  .rw-progress-box {
    margin-top: 1px;
  }
  .rw-progress-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .rw-bar-track {
    width: 100%;
    height: 5px;
    background: var(--bar-bg);
    border-radius: 3px;
    overflow: hidden;
  }
  .rw-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  /* Quick Logger Pill Buttons */
  .rw-log-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-top: 2px;
  }
  .btn-log-chip {
    flex: 1;
    min-height: 26px;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 700;
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: all 0.12s ease;
  }
  .btn-log-chip:active {
    transform: scale(0.92);
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--accent);
  }
  .rw-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 2px;
  }
  .rw-chip {
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .rw-chip-lbl {
    font-size: 8.5px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
  }
  .rw-chip-val {
    font-size: 11px;
    color: var(--text);
    font-weight: 700;
    margin-top: 1px;
  }
  /* Toast feedback */
  .toast {
    position: fixed;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--accent);
    color: #F1F5F9;
    font-size: 9.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
<script>
(function(){
  function resolveTheme(){
    try {
      var local = localStorage.getItem('v07_theme') || localStorage.getItem('v07_app_theme');
      if (local === 'light' || local === 'dark') return local;
    } catch(e){}
    return 'dark';
  }
  function apply(t){
    document.documentElement.setAttribute('data-theme', t);
  }
  apply(resolveTheme());
  window.addEventListener('storage', function(){ apply(resolveTheme()); });
})();
</script>
</head>
<body onclick="openRunningPlugin(event)">
  <div class="rw-wrap">
    <div class="rw-head">
      <div class="rw-badge">
        <span class="material-symbols-outlined" style="font-size:12px;">directions_run</span>
        <span>Runtime Cadence</span>
      </div>
      <div class="rw-stat" id="streakLabel">0 Runs This Week</div>
    </div>

    <div class="rw-progress-box">
      <div class="rw-progress-head">
        <span style="color:var(--muted);font-size:10px;">Weekly Mileage Target</span>
        <span id="mileageLabel" style="color:var(--accent);">0.0 / 25 km (0%)</span>
      </div>
      <div class="rw-bar-track">
        <div class="rw-bar-fill" id="mileageBar" style="width:0%"></div>
      </div>
    </div>

    <!-- Direct 1-Tap Session Logger Buttons -->
    <div class="rw-log-row">
      <button class="btn-log-chip" onclick="logRun(2.0, 12, event)">+2 km</button>
      <button class="btn-log-chip" onclick="logRun(3.0, 18, event)">+3 km</button>
      <button class="btn-log-chip" onclick="logRun(5.0, 28, event)">+5 km</button>
      <button class="btn-log-chip" onclick="logRun(10.0, 56, event)">+10 km</button>
    </div>

    <div class="rw-grid">
      <div class="rw-chip">
        <span class="rw-chip-lbl">Last Run</span>
        <span class="rw-chip-val" id="lastRunDist">-- km</span>
      </div>
      <div class="rw-chip">
        <span class="rw-chip-lbl">Avg Pace</span>
        <span class="rw-chip-val" id="avgPace">5'20"</span>
      </div>
      <div class="rw-chip">
        <span class="rw-chip-lbl">Total Time</span>
        <span class="rw-chip-val" id="totalTime">0m</span>
      </div>
    </div>
  </div>
  <div id="toast" class="toast">Run logged</div>

<script>
  function showToast(msg){
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  function getSessions(){
    try {
      var s = localStorage.getItem('running_sessions');
      if(s) return JSON.parse(s);
    } catch(_) {}
    return [
      { distance: 5.2, duration: 28, timestamp: Date.now() - 86400000 * 2 },
      { distance: 6.0, duration: 32, timestamp: Date.now() - 86400000 * 4 }
    ];
  }

  function saveSessions(sessions){
    try {
      localStorage.setItem('running_sessions', JSON.stringify(sessions));
    } catch(_) {}
  }

  function loadStats() {
    try {
      var goal = parseFloat(localStorage.getItem('running_weekly_goal') || '25');
      var unit = localStorage.getItem('running_unit') || 'km';
      var sessions = getSessions();
      
      var totalDist = 0;
      var totalSec = 0;
      sessions.forEach(function(s){
        totalDist += (parseFloat(s.distance) || 0);
        totalSec += (parseFloat(s.duration) || 0) * 60;
      });

      var pct = Math.min(100, Math.round((totalDist / goal) * 100));
      document.getElementById('mileageLabel').textContent = totalDist.toFixed(1) + ' / ' + goal + ' ' + unit + ' (' + pct + '%)';
      document.getElementById('mileageBar').style.width = pct + '%';

      var runsCount = sessions.length;
      document.getElementById('streakLabel').textContent = runsCount + ' Runs This Week';

      var lastDist = sessions.length > 0 ? (parseFloat(sessions[sessions.length-1].distance) || 0) : 0;
      document.getElementById('lastRunDist').textContent = lastDist > 0 ? (lastDist.toFixed(1) + ' ' + unit) : '--';

      var hrs = Math.floor(totalSec / 3600);
      var mins = Math.floor((totalSec % 3600) / 60);
      document.getElementById('totalTime').textContent = (hrs > 0 ? hrs + 'h ' : '') + mins + 'm';
    } catch (_) {}
  }

  window.logRun = function(distKm, durationMins, e) {
    if (e) e.stopPropagation();
    var sessions = getSessions();
    sessions.push({
      distance: distKm,
      duration: durationMins,
      timestamp: Date.now()
    });
    saveSessions(sessions);
    showToast('🏃 Logged: +' + distKm.toFixed(1) + ' km (' + durationMins + 'm)');
    loadStats();

    try {
      window.parent.postMessage({ type: 'v07_refresh' }, '*');
    } catch (_) {}
  };

  function openRunningPlugin(e) {
    if (e && e.target && e.target.closest('.btn-log-chip')) return;
    try {
      if (window.parent && window.parent.openPluginPage) {
        window.parent.openPluginPage('com.v07.running');
      } else if (window.parent && window.parent.postMessage) {
        window.parent.postMessage({ type: 'v3:plugin:open', pluginId: 'com.v07.running' }, '*');
      }
    } catch (_) {}
  }

  loadStats();
</script>
</body>
</html>
