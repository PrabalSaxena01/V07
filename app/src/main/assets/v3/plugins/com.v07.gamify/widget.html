<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gamify Widget</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --text: #F1F5F9;
    --muted: #94A3B8;
    --border: rgba(255, 255, 255, 0.08);
    --bar-bg: rgba(255, 255, 255, 0.08);
    --chip-bg: rgba(255, 255, 255, 0.04);
    --green: #4DE086;
    --green-glow: rgba(77, 224, 134, 0.15);
  }
  :root[data-theme="light"] {
    --text: #0F172A;
    --muted: #64748B;
    --border: rgba(0, 0, 0, 0.08);
    --bar-bg: rgba(0, 0, 0, 0.08);
    --chip-bg: rgba(0, 0, 0, 0.04);
    --green: #16A34A;
    --green-glow: rgba(22, 163, 74, 0.12);
  }
  body {
    margin: 0;
    padding: 8px 12px 10px;
    background: transparent;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
    width: 100%;
    user-select: none;
  }
  .gw-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  .gw-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .gw-lvl-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gw-badge {
    font-size: 10px;
    font-weight: 700;
    color: var(--green);
    background: var(--green-glow);
    border: 1px solid var(--green);
    border-radius: 4px;
    padding: 2px 6px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .gw-rank {
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .gw-total {
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
  }
  .gw-bar-track {
    width: 100%;
    height: 5px;
    background: var(--bar-bg);
    border-radius: 3px;
    overflow: hidden;
  }
  .gw-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 3px;
    transition: width 0.35s ease;
  }
  /* Quick XP Logger Row */
  .xp-log-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-top: 1px;
  }
  .btn-xp-chip {
    flex: 1;
    min-height: 26px;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 700;
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: all 0.12s ease;
  }
  .btn-xp-chip:active {
    transform: scale(0.92);
    background: var(--green-glow);
    border-color: var(--green);
    color: var(--green);
  }
  .gw-chips {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .gw-chip {
    font-size: 9px;
    color: var(--muted);
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .gw-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: inline-block;
  }
  .gw-dot.on {
    background: var(--green);
    box-shadow: 0 0 5px var(--green);
  }
  .gw-dot.off {
    background: var(--muted);
  }
  .gw-chip-val {
    color: var(--text);
    font-weight: 700;
  }
  /* Toast feedback */
  .toast {
    position: fixed;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--green);
    color: #F1F5F9;
    font-size: 9.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
<script>
(function(){
  function syncTheme(){
    var t = 'dark';
    try {
      t = window.parent.document.documentElement.dataset.theme || localStorage.getItem('v07_theme') || 'dark';
    } catch(e){
      try { t = localStorage.getItem('v07_theme') || 'dark'; } catch(e2){}
    }
    if(t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }
  syncTheme();
  window.addEventListener('storage', syncTheme);
})();
</script>
</head>
<body onclick="openGamifyPlugin(event)">
<div id="w"></div>
<div id="toast" class="toast">XP logged</div>

<script src="plugin.js"></script>
<script>
function showToast(msg){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

function rankTitle(lvl) {
  if (lvl >= 8) return 'ARCHITECT';
  if (lvl >= 7) return 'ELITE';
  if (lvl >= 6) return 'MASTER';
  if (lvl >= 5) return 'EXPERT';
  if (lvl >= 4) return 'SPECIALIST';
  if (lvl >= 3) return 'OPERATOR';
  if (lvl >= 2) return 'APPRENTICE';
  return 'NOVICE';
}

function openGamifyPlugin(e){
  if(e && e.target && e.target.closest('.btn-xp-chip')) return;
  try {
    if(window.parent && window.parent.openPluginPage){
      window.parent.openPluginPage('com.v07.gamify');
      return;
    }
    if(window.parent && window.parent.postMessage){
      window.parent.postMessage({ type: 'v3:plugin:open', pluginId: 'com.v07.gamify' }, '*');
      return;
    }
  } catch(e){}
  location.href = 'index.html';
}

function getSize(){
  try {
    var s = new URLSearchParams(window.location.search).get('size');
    if(s === 'compact' || s === '1*1') return 'compact';
    if(s === 'small' || s === '2*1') return 'small';
    if(s === 'medium' || s === '3*1') return 'medium';
    if(s === 'large' || s === '4*2') return 'large';
  } catch(e){}
  var h = window.innerHeight;
  if(h > 0 && h <= 85) return 'compact';
  if(h > 85 && h <= 125) return 'small';
  if(h > 125 && h <= 190) return 'medium';
  if(h > 190) return 'large';
  return 'medium';
}

function getGamifyData(){
  try {
    var raw = localStorage.getItem('v07_gamify_data');
    if(raw) return JSON.parse(raw);
  } catch(_) {}
  return { xp: 140, level: 2, todayXp: 35, streak: 4 };
}

function saveGamifyData(d){
  try {
    localStorage.setItem('v07_gamify_data', JSON.stringify(d));
  } catch(_) {}
}

window.logXp = function(amount, reason, e){
  if(e) e.stopPropagation();
  var d = getGamifyData();
  d.xp = (d.xp || 0) + amount;
  d.todayXp = (d.todayXp || 0) + amount;
  d.level = Math.floor(d.xp / 100) + 1;
  saveGamifyData(d);

  if (window.v07Gamify && window.v07Gamify.addXp) {
    try { window.v07Gamify.addXp(amount, reason); } catch(_) {}
  }

  showToast('⚔️ +' + amount + ' XP Logged: ' + reason);
  draw();

  try {
    window.parent.postMessage({ type: 'v07_refresh' }, '*');
  } catch(_) {}
};

window.addEventListener('resize', draw);
window.addEventListener('message', function(e){
  if(e.data && (e.data.type === 'setSize' || e.data.type === 'v07_refresh')){
    draw();
  }
});

function draw() {
  var el = document.getElementById('w');
  if (!el) return;

  var d = getGamifyData();
  var total = d.xp || 140;
  var lvl = d.level || Math.floor(total / 100) + 1;
  var rank = rankTitle(lvl);
  var progress = Math.min(100, Math.round(((total % 100) / 100) * 100)) || 20;
  var toNext = 100 - (total % 100);
  var todayXp = d.todayXp || 35;
  var streak = d.streak || 4;
  var size = getSize();

  if(size === 'compact'){
    el.innerHTML =
      '<div class="gw-wrap" style="cursor:pointer">' +
        '<div class="gw-row1">' +
          '<span class="gw-badge">LVL ' + lvl + '</span>' +
          '<span class="gw-rank">' + rank + '</span>' +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0">' +
          '<span style="font-size:12px;font-weight:700;color:var(--text)">' + total.toLocaleString() + ' XP</span>' +
          '<span style="font-size:9px;color:var(--muted)">' + progress + '% to L' + (lvl + 1) + '</span>' +
        '</div>' +
        '<div class="gw-bar-track"><div class="gw-bar-fill" style="width:' + progress + '%"></div></div>' +
      '</div>';
    return;
  }

  el.innerHTML =
    '<div class="gw-wrap" style="cursor:pointer">' +
      '<div class="gw-row1">' +
        '<div class="gw-lvl-group">' +
          '<span class="gw-badge">LVL ' + lvl + ' · ' + rank + '</span>' +
        '</div>' +
        '<span class="gw-total">' + total.toLocaleString() + ' <span style="font-size:9px;color:var(--muted);font-weight:400">XP</span></span>' +
      '</div>' +
      '<div class="gw-bar-track">' +
        '<div class="gw-bar-fill" style="width:' + progress + '%"></div>' +
      '</div>' +
      '<div class="xp-log-row">' +
        '<button class="btn-xp-chip" onclick="logXp(10, \'Focus Sprint\', event)">+10 Focus</button>' +
        '<button class="btn-xp-chip" onclick="logXp(25, \'Deep Quest\', event)">+25 Quest</button>' +
        '<button class="btn-xp-chip" onclick="logXp(50, \'Milestone\', event)">+50 Epic</button>' +
      '</div>' +
      '<div class="gw-chips">' +
        '<span class="gw-chip"><span class="gw-dot ' + (todayXp > 0 ? 'on' : 'off') + '"></span> TODAY <span class="gw-chip-val">+' + todayXp + ' XP</span></span>' +
        '<span class="gw-chip">STREAK <span class="gw-chip-val">' + streak + 'd</span></span>' +
        '<span class="gw-chip">NEXT <span class="gw-chip-val">' + toNext + ' XP</span></span>' +
      '</div>' +
    '</div>';
}
draw();
</script>
</body>
</html>
