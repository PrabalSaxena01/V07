<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Reader Widget</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --text: #F1F5F9;
    --muted: #94A3B8;
    --bar-bg: rgba(255,255,255,0.08);
    --chip-bg: rgba(255,255,255,0.04);
    --chip-border: rgba(255,255,255,0.08);
    --accent: #8D6CFF;
    --accent-light: #A78BFA;
    --accent-glow: rgba(141,108,255,0.15);
  }
  :root[data-theme="light"] {
    --text: #0F172A;
    --muted: #64748B;
    --bar-bg: rgba(0,0,0,0.08);
    --chip-bg: rgba(0,0,0,0.04);
    --chip-border: rgba(0,0,0,0.08);
    --accent: #7C3AED;
    --accent-light: #6D28D9;
    --accent-glow: rgba(124,58,237,0.12);
  }
  body {
    margin: 0;
    padding: 8px 12px 10px;
    background: transparent;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
    width: 100%;
    cursor: pointer;
    user-select: none;
  }
  .rw-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  .rw-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .rw-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-light);
    background: var(--accent-glow);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2px 6px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .rw-title {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.25;
  }
  .rw-author {
    font-size: 10px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rw-bar-track {
    width: 100%;
    height: 5px;
    background: var(--bar-bg);
    border-radius: 3px;
    overflow: hidden;
  }
  .rw-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s ease;
  }
  .rw-chips {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
  }
  .rw-chip {
    flex: 1;
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 4px;
    padding: 3px 6px;
    text-align: center;
    font-size: 9px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rw-chip-val {
    color: var(--text);
    font-weight: 700;
  }
  .rw-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 9px;
    color: var(--muted);
  }
  .btn-step {
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    color: var(--text);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    font-size: 9px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-step:active { transform: scale(0.95); }
</style>
<script>
(function(){
  function syncTheme(){
    var t = 'dark';
    try {
      t = window.parent.document.documentElement.dataset.theme || localStorage.getItem('v07_theme') || 'dark';
    } catch(e){
      try { t = localStorage.getItem('v07_theme') || 'dark'; } catch(e2){}
    }
    if(t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }
  syncTheme();
  window.addEventListener('storage', syncTheme);
})();
</script>
</head>
<body onclick="openPlugin()">
<div id="wRoot">
  <div style="font-size:10px;color:var(--muted)">loading library&hellip;</div>
</div>

<script>
var STORAGE_KEY = 'v07_reader_books';

function getSize(){
  try {
    var s = new URLSearchParams(window.location.search).get('size');
    if(s === 'compact' || s === '1*1') return 'compact';
    if(s === 'small' || s === '2*1') return 'small';
    if(s === 'medium' || s === '3*1') return 'medium';
    if(s === 'large' || s === '4*2') return 'large';
  } catch(e){}
  var h = window.innerHeight;
  if(h > 0 && h <= 85) return 'compact';
  if(h > 85 && h <= 125) return 'small';
  if(h > 125 && h <= 190) return 'medium';
  if(h > 190) return 'large';
  return 'medium';
}

function openPlugin(){
  try {
    if(window.parent && window.parent.openPluginPage){
      window.parent.openPluginPage('com.v07.reader');
      return;
    }
  } catch(e){}
  location.href = 'index.html';
}

function bumpPages(e, delta){
  e.stopPropagation();
  var books = getBooks();
  var active = books.find(function(b){ return b.shelf === 'reading'; });
  if(!active) return;
  var cur = parseInt(active.currentPage, 10) || 0;
  var tot = parseInt(active.pages, 10) || 1;
  active.currentPage = Math.min(tot, Math.max(0, cur + delta));
  if(active.currentPage >= tot){
    active.shelf = 'finished';
  }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
    window.parent.postMessage({ type: 'v07_refresh' }, '*');
  } catch(err){}
  draw();
}

function getBooks(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}

function esc(str){
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

window.addEventListener('resize', draw);
window.addEventListener('message', function(e){
  if(e.data && (e.data.type === 'setSize' || e.data.type === 'v07_refresh')){
    draw();
  }
});

function draw(){
  var root = document.getElementById('wRoot');
  if(!root) return;

  var books = getBooks();
  var active = books.find(function(b){ return b.shelf === 'reading'; });
  var size = getSize();

  if(!active){
    var totalFinished = books.filter(function(b){ return b.shelf === 'finished'; }).length;
    var totalQueue = books.filter(function(b){ return b.shelf === 'toread'; }).length;
    root.innerHTML =
      '<div class="rw-wrap">' +
      '  <div class="rw-head">' +
      '    <div class="rw-badge">📖 LIBRARY</div>' +
      '    <div style="font-size:9.5px;color:var(--muted)">' + books.length + ' volumes</div>' +
      '  </div>' +
      '  <div style="font-size:11px;color:var(--text);font-weight:600;padding:4px 0">No active book in reading shelf</div>' +
      '  <div class="rw-chips">' +
      '    <span class="rw-chip">FINISHED <span class="rw-chip-val">' + totalFinished + '</span></span>' +
      '    <span class="rw-chip">TO READ <span class="rw-chip-val">' + totalQueue + '</span></span>' +
      '  </div>' +
      '</div>';
    return;
  }

  var cur = parseInt(active.currentPage, 10) || 0;
  var tot = parseInt(active.pages, 10) || 1;
  var pct = Math.min(100, Math.round((cur / tot) * 100));
  var remaining = Math.max(0, tot - cur);

  if(size === 'compact'){
    root.innerHTML =
      '<div class="rw-wrap">' +
      '  <div class="rw-head">' +
      '    <div class="rw-badge" style="font-size:9px;padding:1px 5px">📖 ' + pct + '%</div>' +
      '    <div style="font-size:9px;color:var(--accent-light);font-weight:700">' + cur + '/' + tot + 'p</div>' +
      '  </div>' +
      '  <div class="rw-title" style="font-size:11.5px">' + esc(active.title) + '</div>' +
      '  <div class="rw-bar-track"><div class="rw-bar-fill" style="width:' + pct + '%"></div></div>' +
      '</div>';
  } else if(size === 'small'){
    root.innerHTML =
      '<div class="rw-wrap">' +
      '  <div class="rw-head">' +
      '    <div class="rw-badge">📖 READING</div>' +
      '    <div style="font-size:10px;font-weight:700;color:var(--accent-light)">' + pct + '%</div>' +
      '  </div>' +
      '  <div class="rw-title">' + esc(active.title) + '</div>' +
      '  <div class="rw-bar-track"><div class="rw-bar-fill" style="width:' + pct + '%"></div></div>' +
      '  <div class="rw-chips">' +
      '    <span class="rw-chip">PAGE <span class="rw-chip-val">' + cur + '/' + tot + '</span></span>' +
      '    <span class="rw-chip">LEFT <span class="rw-chip-val">' + remaining + 'p</span></span>' +
      '  </div>' +
      '</div>';
  } else if(size === 'medium'){
    root.innerHTML =
      '<div class="rw-wrap">' +
      '  <div class="rw-head">' +
      '    <div class="rw-badge">📖 READING TRACKER</div>' +
      '    <div style="font-size:9px;color:var(--muted)">' + remaining + 'p to finish</div>' +
      '  </div>' +
      '  <div>' +
      '    <div class="rw-title">' + esc(active.title) + '</div>' +
      '    <div class="rw-author">' + esc(active.author || 'Unknown') + '</div>' +
      '  </div>' +
      '  <div class="rw-bar-track"><div class="rw-bar-fill" style="width:' + pct + '%"></div></div>' +
      '  <div class="rw-chips">' +
      '    <span class="rw-chip">PROGRESS <span class="rw-chip-val">' + pct + '%</span></span>' +
      '    <span class="rw-chip">PAGE <span class="rw-chip-val">' + cur + '/' + tot + '</span></span>' +
      '    <span class="rw-chip">PACE <span class="rw-chip-val">~' + Math.ceil(remaining/15) + 'd</span></span>' +
      '  </div>' +
      '  <div class="rw-footer">' +
      '    <span>Quick Log:</span>' +
      '    <div style="display:flex;gap:4px">' +
      '      <button class="btn-step" onclick="bumpPages(event, 5)">+5p</button>' +
      '      <button class="btn-step" onclick="bumpPages(event, 10)">+10p</button>' +
      '      <button class="btn-step" onclick="bumpPages(event, 25)">+25p</button>' +
      '    </div>' +
      '  </div>' +
      '</div>';
  } else {
    // Large (250px)
    var days15 = Math.ceil(remaining / 15);
    var days25 = Math.ceil(remaining / 25);
    var totalFinished = books.filter(function(b){ return b.shelf === 'finished'; }).length;
    var totalQueue = books.filter(function(b){ return b.shelf === 'toread'; }).length;

    root.innerHTML =
      '<div class="rw-wrap">' +
      '  <div class="rw-head">' +
      '    <div class="rw-badge" style="font-size:11px;padding:3px 7px">📖 BOOK COLLECTION</div>' +
      '    <div style="font-size:10px;color:var(--accent-light);font-weight:700">' + pct + '% COMPLETE</div>' +
      '  </div>' +
      '  <div style="background:var(--chip-bg);border:1px solid var(--chip-border);border-radius:6px;padding:8px 10px">' +
      '    <div class="rw-title" style="font-size:14px">' + esc(active.title) + '</div>' +
      '    <div class="rw-author" style="margin-bottom:6px">' + esc(active.author || 'Unknown') + '</div>' +
      '    <div class="rw-bar-track" style="height:6px;margin-bottom:6px"><div class="rw-bar-fill" style="width:' + pct + '%"></div></div>' +
      '    <div style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted)">' +
      '      <span>Page ' + cur + ' of ' + tot + '</span>' +
      '      <span style="color:var(--text);font-weight:700">' + remaining + ' pages remaining</span>' +
      '    </div>' +
      '  </div>' +
      '  <div class="rw-chips">' +
      '    <span class="rw-chip">FINISH (~15p/d) <span class="rw-chip-val">' + days15 + ' days</span></span>' +
      '    <span class="rw-chip">SPRINT (~25p/d) <span class="rw-chip-val">' + days25 + ' days</span></span>' +
      '  </div>' +
      '  <div class="rw-chips">' +
      '    <span class="rw-chip">FINISHED <span class="rw-chip-val">' + totalFinished + ' books</span></span>' +
      '    <span class="rw-chip">QUEUE <span class="rw-chip-val">' + totalQueue + ' books</span></span>' +
      '  </div>' +
      '  <div class="rw-footer" style="padding-top:4px">' +
      '    <span>Quick increment:</span>' +
      '    <div style="display:flex;gap:6px">' +
      '      <button class="btn-step" onclick="bumpPages(event, 5)">+5 PAGES</button>' +
      '      <button class="btn-step" onclick="bumpPages(event, 10)">+10 PAGES</button>' +
      '      <button class="btn-step" onclick="bumpPages(event, 25)">+25 PAGES</button>' +
      '    </div>' +
      '  </div>' +
      '</div>';
  }
}

draw();
setInterval(draw, 20000);
</script>
</body>
</html>
