<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Plugin Settings</title>
<link rel="stylesheet" href="plugin.css">
<script>
(function(){
  function resolveTheme(){
      try {
        var local = localStorage.getItem('v07_theme') || localStorage.getItem('v07_app_theme');
        if (local === 'light' || local === 'dark') return local;
        var params = new URLSearchParams(window.location.search);
        var qTheme = params.get('theme');
        if (qTheme === 'light' || qTheme === 'dark') return qTheme;
        if (window.AndroidTheme && typeof window.AndroidTheme.isDark === 'function') {
          return window.AndroidTheme.isDark() ? 'dark' : 'light';
        }
        if (window.parent && window.parent !== window && window.parent.document && window.parent.document.documentElement.dataset.theme) {
          return window.parent.document.documentElement.dataset.theme;
        }
      } catch(e){}
      return 'dark';
    }
  function apply(t){
    document.documentElement.setAttribute('data-theme', t);
    if (t === 'light') {
      document.documentElement.classList.add('light');
      document.documentElement.classList.remove('dark');
      if (document.body) { document.body.classList.add('light'); document.body.classList.remove('dark'); }
    } else {
      document.documentElement.classList.add('dark');
      document.documentElement.classList.remove('light');
      if (document.body) { document.body.classList.add('dark'); document.body.classList.remove('light'); }
    }
  }
  apply(resolveTheme());
  window.addEventListener('storage', function(e){ if(!e || !e.key || e.key === 'v07_theme' || e.key === 'v07_app_theme') apply(resolveTheme()); });
  window.addEventListener('v07-theme-changed', function(e){
      if(e.detail && (e.detail.theme === 'light' || e.detail.theme === 'dark')) {
        try { localStorage.setItem('v07_theme', e.detail.theme); } catch(ex){}
        apply(e.detail.theme);
      }
    });
  document.addEventListener('DOMContentLoaded', function(){ apply(resolveTheme()); });
})();
</script>
</head>
<body>
<div class="plugin-page">
  <div class="page-header">
    <div class="title">TEMPLATE SETTINGS</div>
  </div>

  <div class="card">
    <div class="card-title">Custom Options</div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:8px">
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer">
        <input type="checkbox" id="prefHighContrast" checked> Enable High Contrast Mode
      </label>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer">
        <input type="checkbox" id="prefAutoSync" checked> Automatic Background Sync
      </label>
    </div>
  </div>
</div>
<script>
// Save/load custom plugin preferences
var hc = document.getElementById('prefHighContrast');
var as = document.getElementById('prefAutoSync');
try {
  hc.checked = localStorage.getItem('tpl_high_contrast') !== 'false';
  as.checked = localStorage.getItem('tpl_auto_sync') !== 'false';
} catch(e){}

hc.onchange = function(){ localStorage.setItem('tpl_high_contrast', hc.checked); };
as.onchange = function(){ localStorage.setItem('tpl_auto_sync', as.checked); };
</script>
</body>
</html>
