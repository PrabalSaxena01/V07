<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tasks & Directives Widget</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: transparent;
    --text: #F1F5F9;
    --muted: #94A3B8;
    --border: rgba(255, 255, 255, 0.08);
    --bar-bg: rgba(255, 255, 255, 0.08);
    --chip-bg: rgba(255, 255, 255, 0.04);
    --card-bg: rgba(15, 23, 42, 0.65);
    --accent: #5CE1E6;
    --accent-glow: rgba(92, 225, 230, 0.15);
    --green: #4DE086;
    --input-bg: rgba(255, 255, 255, 0.06);
  }
  :root[data-theme="light"] {
    --text: #0F172A;
    --muted: #64748B;
    --border: rgba(0, 0, 0, 0.08);
    --bar-bg: rgba(0, 0, 0, 0.08);
    --chip-bg: rgba(0, 0, 0, 0.04);
    --card-bg: rgba(248, 250, 252, 0.85);
    --accent: #0284C7;
    --accent-glow: rgba(2, 132, 199, 0.12);
    --green: #16A34A;
    --input-bg: rgba(0, 0, 0, 0.04);
  }
  body {
    margin: 0;
    padding: 8px 12px 10px;
    background: var(--bg);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
    width: 100%;
    user-select: none;
  }
  .gw-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  .gw-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .gw-lvl-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gw-badge {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-glow);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2px 6px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .gw-rank {
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .gw-total {
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
  }
  .gw-bar-track {
    width: 100%;
    height: 5px;
    background: var(--bar-bg);
    border-radius: 3px;
    overflow: hidden;
  }
  .gw-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin: 2px 0;
    max-height: 105px;
    overflow-y: auto;
  }
  .task-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text);
    min-width: 0;
    padding: 3px 2px;
    border-radius: 4px;
    transition: background 0.15s ease;
  }
  .task-check {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    flex-shrink: 0;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .task-check:active {
    transform: scale(0.9);
  }
  .task-check.done {
    border-color: var(--green);
    background: var(--green);
    color: #0F172A;
  }
  .task-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.01em;
    cursor: pointer;
    font-weight: 500;
  }
  .task-text.done {
    text-decoration: line-through;
    color: var(--muted);
    opacity: 0.7;
  }
  .task-time {
    font-size: 9px;
    color: var(--muted);
    flex-shrink: 0;
  }
  /* Inline Quick Task Adder */
  .quick-add-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  .quick-add-input {
    flex: 1;
    min-width: 0;
    height: 28px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 8px;
    font-family: inherit;
    font-size: 10.5px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s ease;
  }
  .quick-add-input:focus {
    border-color: var(--accent);
  }
  .quick-add-input::placeholder {
    color: var(--muted);
    opacity: 0.7;
  }
  .quick-add-btn {
    height: 28px;
    padding: 0 10px;
    background: var(--accent);
    color: #090D16;
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .quick-add-btn:active {
    transform: scale(0.95);
  }
  .gw-chips {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-top: 2px;
  }
  .gw-chip {
    font-size: 9px;
    color: var(--muted);
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    cursor: pointer;
  }
  .gw-chip:active { transform: scale(0.97); }
  .gw-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: inline-block;
  }
  .gw-dot.on {
    background: var(--accent);
    box-shadow: 0 0 5px var(--accent);
  }
  .gw-dot.off {
    background: var(--muted);
  }
  .gw-chip-val {
    color: var(--text);
    font-weight: 700;
  }
  /* Toast feedback */
  .toast {
    position: fixed;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--accent);
    color: #F1F5F9;
    font-size: 9.5px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
<script>
(function(){
  function syncTheme(){
    var t = 'dark';
    try {
      t = window.parent.document.documentElement.dataset.theme || localStorage.getItem('v07_theme') || 'dark';
    } catch(e){
      try { t = localStorage.getItem('v07_theme') || 'dark'; } catch(e2){}
    }
    if(t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }
  syncTheme();
  window.addEventListener('storage', syncTheme);
})();
</script>
</head>
<body>
<div id="w"></div>
<div id="toast" class="toast">Directive logged</div>

<script>
function esc(s){
  if(s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

function openTaskPlugin(event){
  if(event && event.target && (event.target.closest('.task-check') || event.target.closest('.quick-add-row') || event.target.tagName === 'INPUT' || event.target.tagName === 'BUTTON')) return;
  try {
    if(window.parent && window.parent.openPluginPage){
      window.parent.openPluginPage('com.v07.tasks');
      return;
    }
    if(window.parent && window.parent.postMessage){
      window.parent.postMessage({ type: 'v3:plugin:open', pluginId: 'com.v07.tasks' }, '*');
      return;
    }
  } catch(e){}
  location.href = 'index.html';
}

function getLocalTasks(){
  try {
    var s = localStorage.getItem('v07_plugin_tasks_data');
    if(s) return JSON.parse(s);
  } catch(e){}
  return [];
}

function saveLocalTasks(tasks){
  try {
    localStorage.setItem('v07_plugin_tasks_data', JSON.stringify(tasks));
  } catch(e){}
}

async function toggleTask(id, event){
  if(event){
    event.stopPropagation();
    event.preventDefault();
  }
  var list = getLocalTasks();
  var t = list.find(function(x){ return x.id === id; });
  var wasDone = t ? !!t.done : false;
  if(t){
    t.done = !wasDone;
    saveLocalTasks(list);
    showToast(t.done ? '✓ Completed: ' + t.title : '↺ Reopened: ' + t.title);
  }
  draw();

  try {
    var endpoint = wasDone ? ('/task/' + encodeURIComponent(id) + '/reopen') : ('/task/' + encodeURIComponent(id) + '/done');
    await fetch(endpoint, { method: 'POST' });
  } catch(e){}
  try {
    await fetch('/checklist/' + encodeURIComponent(id) + '/toggle', { method: 'POST' });
  } catch(e){}
  try {
    window.parent.postMessage({ type: 'v07_refresh' }, '*');
  } catch(e){}
}

async function quickAddTask(event){
  if(event) event.preventDefault();
  var input = document.getElementById('quickTaskInput');
  if(!input) return;
  var title = input.value.trim();
  if(!title) return;

  var newTask = {
    id: 'task_' + Date.now(),
    title: title,
    done: false,
    priority: 'high',
    deadline: 'Today',
    created_at: new Date().toISOString()
  };

  var list = getLocalTasks();
  list.unshift(newTask);
  saveLocalTasks(list);
  input.value = '';
  showToast('✓ Directive added: ' + title);
  draw();

  try {
    await fetch('/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newTask)
    });
  } catch(e){}
  try {
    window.parent.postMessage({ type: 'v07_refresh' }, '*');
  } catch(e){}
}

function getSize(){
  try {
    var s = new URLSearchParams(window.location.search).get('size');
    if(s === 'compact' || s === '1*1') return 'compact';
    if(s === 'small' || s === '2*1') return 'small';
    if(s === 'medium' || s === '3*1') return 'medium';
    if(s === 'large' || s === '4*2') return 'large';
  } catch(e){}
  var h = window.innerHeight;
  if(h > 0 && h <= 85) return 'compact';
  if(h > 85 && h <= 125) return 'small';
  if(h > 125 && h <= 190) return 'medium';
  if(h > 190) return 'large';
  return 'medium';
}

window.addEventListener('resize', draw);
window.addEventListener('message', function(e){
  if(e.data && (e.data.type === 'setSize' || e.data.type === 'v07_refresh')){
    draw();
  }
});

async function draw(){
  var el = document.getElementById('w');
  if(!el) return;
  var size = getSize();

  var tasks = getLocalTasks();
  if(!tasks || !tasks.length){
    try {
      var r = await fetch('/tasks?filter=all');
      if(r.ok){
        var j = await r.json();
        if(j && Array.isArray(j.tasks) && j.tasks.length){
          tasks = j.tasks.map(function(t){
            return {
              id: t.id,
              title: t.title,
              done: t.status === 'done',
              priority: t.priority || 'medium',
              deadline: t.deadline || ''
            };
          });
          saveLocalTasks(tasks);
        }
      }
    } catch(e){}
  }

  tasks = tasks || [];
  var done = tasks.filter(function(t){ return t.done; }).length;
  var total = tasks.length;
  var pct = total > 0 ? Math.round((done / total) * 100) : 0;
  var pending = total - done;

  if(size === 'compact'){
    el.innerHTML =
      '<div class="gw-wrap" onclick="openTaskPlugin(event)" style="cursor:pointer">' +
      '  <div class="gw-row1">' +
      '    <span class="gw-badge">✓ DIRECTIVES</span>' +
      '    <span class="gw-rank">' + done + '/' + total + '</span>' +
      '  </div>' +
      '  <div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0">' +
      '    <span style="font-size:12px;font-weight:700;color:var(--text)">' + pct + '% DONE</span>' +
      '    <span style="font-size:9px;color:var(--muted)">' + pending + ' PENDING</span>' +
      '  </div>' +
      '  <div class="gw-bar-track"><div class="gw-bar-fill" style="width:' + pct + '%"></div></div>' +
      '</div>';
    return;
  }

  if(size === 'small'){
    var topTask = tasks.find(function(t){ return !t.done; }) || tasks[0];
    var taskSnippet = topTask ?
      '<div style="font-size:10px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 0;display:flex;align-items:center;gap:6px">' +
      '  <span class="task-check ' + (topTask.done ? 'done' : '') + '" onclick="toggleTask(\'' + topTask.id + '\', event)">' + (topTask.done ? '✓' : '') + '</span>' +
      '  <span class="task-text ' + (topTask.done ? 'done' : '') + '">' + esc(topTask.title) + '</span>' +
      '</div>' :
      '<div style="font-size:10px;color:var(--muted)">No pending directives</div>';

    el.innerHTML =
      '<div class="gw-wrap" onclick="openTaskPlugin(event)" style="cursor:pointer">' +
      '  <div class="gw-row1">' +
      '    <div class="gw-lvl-group">' +
      '      <span class="gw-badge">✓ DIRECTIVES</span>' +
      '      <span class="gw-rank">' + done + '/' + total + ' COMPLETED</span>' +
      '    </div>' +
      '    <span class="gw-total">' + pct + '%</span>' +
      '  </div>' +
      '  <div class="gw-bar-track"><div class="gw-bar-fill" style="width:' + pct + '%"></div></div>' +
      taskSnippet +
      '  <div class="gw-chips">' +
      '    <span class="gw-chip"><span class="gw-dot ' + (done > 0 ? 'on' : 'off') + '"></span> DONE <span class="gw-chip-val">' + done + '</span></span>' +
      '    <span class="gw-chip">PENDING <span class="gw-chip-val">' + pending + '</span></span>' +
      '    <span class="gw-chip" onclick="openTaskPlugin(event)">VIEW ALL &rsaquo;</span>' +
      '  </div>' +
      '</div>';
    return;
  }

  // Medium (170px) and Large (250px)
  var showCount = size === 'medium' ? 2 : 5;
  var rowsHtml = tasks.length === 0 ?
    '<div style="font-size:11px;color:var(--muted);padding:4px 0">No directives scheduled today. Add one below:</div>' :
    tasks.slice(0, showCount).map(function(t){
      var isDone = !!t.done;
      return '<div class="task-item">' +
             '  <span class="task-check ' + (isDone ? 'done' : '') + '" onclick="toggleTask(\'' + t.id + '\', event)">' + (isDone ? '✓' : '') + '</span>' +
             '  <span class="task-text ' + (isDone ? 'done' : '') + '" onclick="openTaskPlugin(event)">' + esc(t.title) + '</span>' +
             '  <span class="task-time">' + esc(t.deadline || '') + '</span>' +
             '</div>';
    }).join('');

  el.innerHTML =
    '<div class="gw-wrap" onclick="openTaskPlugin(event)" style="cursor:pointer">' +
    '  <div class="gw-row1">' +
    '    <div class="gw-lvl-group">' +
    '      <span class="gw-badge">✓ DIRECTIVES &amp; TASKS</span>' +
    '      <span class="gw-rank">' + done + ' OF ' + total + ' COMPLETED</span>' +
    '    </div>' +
    '    <span class="gw-total">' + pct + '%</span>' +
    '  </div>' +
    '  <div class="gw-bar-track">' +
    '    <div class="gw-bar-fill" style="width:' + pct + '%"></div>' +
    '  </div>' +
    '  <div class="task-list">' + rowsHtml + '</div>' +
    '  <form class="quick-add-row" onsubmit="quickAddTask(event)">' +
    '    <input id="quickTaskInput" class="quick-add-input" type="text" placeholder="+ Quick log new directive..." autocomplete="off" />' +
    '    <button type="submit" class="quick-add-btn">+ Log</button>' +
    '  </form>' +
    '  <div class="gw-chips">' +
    '    <span class="gw-chip"><span class="gw-dot ' + (done > 0 ? 'on' : 'off') + '"></span> DONE <span class="gw-chip-val">' + done + '</span></span>' +
    '    <span class="gw-chip">PENDING <span class="gw-chip-val">' + pending + '</span></span>' +
    '    <span class="gw-chip" onclick="openTaskPlugin(event)">EXPAND &rsaquo;</span>' +
    '  </div>' +
    '</div>';
}
draw();
window.addEventListener('storage', draw);
setInterval(draw, 15000);
</script>
</body>
</html>
