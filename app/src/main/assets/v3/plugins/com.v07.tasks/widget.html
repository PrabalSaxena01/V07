<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tasks Widget</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --text: #F1F5F9;
    --muted: #94A3B8;
    --bar-bg: rgba(255,255,255,0.08);
    --chip-bg: rgba(255,255,255,0.04);
    --chip-border: rgba(255,255,255,0.08);
    --accent: #5CE1E6;
    --accent-glow: rgba(92,225,230,0.15);
    --green: #4DE086;
  }
  :root[data-theme="light"] {
    --text: #0F172A;
    --muted: #64748B;
    --bar-bg: rgba(0,0,0,0.08);
    --chip-bg: rgba(0,0,0,0.04);
    --chip-border: rgba(0,0,0,0.08);
    --accent: #0284C7;
    --accent-glow: rgba(2,132,199,0.12);
    --green: #16A34A;
  }
  body {
    margin: 0;
    padding: 8px 12px 10px;
    background: transparent;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
    width: 100%;
    cursor: pointer;
    user-select: none;
  }
  .gw-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  .gw-row1 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .gw-lvl-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gw-badge {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-glow);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2px 6px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .gw-rank {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .gw-total {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
  }
  .gw-bar-track {
    width: 100%;
    height: 5px;
    background: var(--bar-bg);
    border-radius: 3px;
    overflow: hidden;
  }
  .gw-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s ease;
  }
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin: 2px 0;
  }
  .task-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text);
    min-width: 0;
  }
  .task-check {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1.5px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .task-check.done {
    border-color: var(--green);
    background: var(--green);
    color: #000;
  }
  .task-text {
    flex: 1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }
  .task-text.done {
    text-decoration: line-through;
    color: var(--muted);
  }
  .task-time {
    font-size: 9px;
    color: var(--muted);
    flex-shrink: 0;
  }
  .gw-chips {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .gw-chip {
    font-size: 9px;
    color: var(--muted);
    background: var(--chip-bg);
    border: 1px solid var(--chip-border);
    border-radius: 4px;
    padding: 3px 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .gw-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: inline-block;
  }
  .gw-dot.on {
    background: var(--accent);
    box-shadow: 0 0 5px var(--accent);
  }
  .gw-dot.off {
    background: var(--muted);
  }
  .gw-chip-val {
    color: var(--text);
    font-weight: 700;
  }
</style>
<script>
(function(){
  function syncTheme(){
    var t = 'dark';
    try {
      t = window.parent.document.documentElement.dataset.theme || localStorage.getItem('v07_theme') || 'dark';
    } catch(e){
      try { t = localStorage.getItem('v07_theme') || 'dark'; } catch(e2){}
    }
    if(t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    else document.documentElement.removeAttribute('data-theme');
  }
  syncTheme();
  window.addEventListener('storage', syncTheme);
})();
</script>
</head>
<body>
<div id="w"></div>
<script>
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function openTaskPlugin(event){
  if(event && event.target && event.target.closest('.task-check')) return;
  try {
    if(window.parent && window.parent.openPluginPage){
      window.parent.openPluginPage('com.v07.tasks');
      return;
    }
  } catch(e){}
  location.href = 'index.html';
}

function getLocalTasks(){
  try {
    var s = localStorage.getItem('v07_plugin_tasks_data');
    if(s) return JSON.parse(s);
  } catch(e){}
  return [];
}

function saveLocalTasks(tasks){
  try {
    localStorage.setItem('v07_plugin_tasks_data', JSON.stringify(tasks));
  } catch(e){}
}

async function toggleTask(id, event){
  if(event){
    event.stopPropagation();
    event.preventDefault();
  }
  var list = getLocalTasks();
  var t = list.find(function(x){ return x.id === id; });
  var wasDone = t ? !!t.done : false;
  if(t){
    t.done = !wasDone;
    saveLocalTasks(list);
  }
  draw();

  try {
    var endpoint = wasDone ? ('/task/' + encodeURIComponent(id) + '/reopen') : ('/task/' + encodeURIComponent(id) + '/done');
    await fetch(endpoint, { method: 'POST' });
  } catch(e){}
  try {
    await fetch('/checklist/' + encodeURIComponent(id) + '/toggle', { method: 'POST' });
  } catch(e){}
  draw();
}

function getSize(){
  try {
    var s = new URLSearchParams(window.location.search).get('size');
    if(s === 'compact' || s === '1*1') return 'compact';
    if(s === 'small' || s === '2*1') return 'small';
    if(s === 'medium' || s === '3*1') return 'medium';
    if(s === 'large' || s === '4*2') return 'large';
  } catch(e){}
  var h = window.innerHeight;
  if(h > 0 && h <= 85) return 'compact';
  if(h > 85 && h <= 125) return 'small';
  if(h > 125 && h <= 190) return 'medium';
  if(h > 190) return 'large';
  return 'medium';
}

window.addEventListener('resize', draw);
window.addEventListener('message', function(e){
  if(e.data && (e.data.type === 'setSize' || e.data.type === 'v07_refresh')){
    draw();
  }
});

async function draw(){
  var el = document.getElementById('w');
  if(!el) return;
  var size = getSize();

  var tasks = getLocalTasks();
  if(!tasks || !tasks.length){
    try {
      var r = await fetch('/tasks?filter=all');
      if(r.ok){
        var j = await r.json();
        if(j && Array.isArray(j.tasks) && j.tasks.length){
          tasks = j.tasks.map(function(t){
            return {
              id: t.id,
              title: t.title,
              done: t.status === 'done',
              priority: t.priority || 'medium',
              deadline: t.deadline || ''
            };
          });
          saveLocalTasks(tasks);
        }
      }
    } catch(e){}
  }

  if(!tasks || !tasks.length){
    try {
      var r2 = await fetch('/checklist/today');
      if(r2.ok){
        var j2 = await r2.json();
        if(j2 && Array.isArray(j2.items) && j2.items.length){
          tasks = j2.items.map(function(t){
            return {
              id: t.id,
              title: t.label || t.title,
              done: t.status === 'done' || t.done === true,
              priority: 'medium'
            };
          });
        }
      }
    } catch(e){}
  }

  tasks = tasks || [];
  var done = tasks.filter(function(t){ return t.done; }).length;
  var total = tasks.length;
  var pct = total > 0 ? Math.round((done / total) * 100) : 0;
  var pending = total - done;

  if(size === 'compact'){
    el.innerHTML =
      '<div class="gw-wrap" onclick="openTaskPlugin(event)" style="cursor:pointer">' +
      '  <div class="gw-row1">' +
      '    <span class="gw-badge">✓ TASKS</span>' +
      '    <span class="gw-rank">' + done + '/' + total + '</span>' +
      '  </div>' +
      '  <div style="display:flex;justify-content:space-between;align-items:center;margin:2px 0">' +
      '    <span style="font-size:12px;font-weight:700;color:var(--text)">' + pct + '% DONE</span>' +
      '    <span style="font-size:9px;color:var(--muted)">' + pending + ' PENDING</span>' +
      '  </div>' +
      '  <div class="gw-bar-track"><div class="gw-bar-fill" style="width:' + pct + '%"></div></div>' +
      '</div>';
    return;
  }

  if(size === 'small'){
    var topTask = tasks.find(function(t){ return !t.done; }) || tasks[0];
    var taskSnippet = topTask ?
      '<div style="font-size:10px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 0">' +
      '  <span style="color:var(--accent)">&bull;</span> ' + esc(topTask.title) +
      '</div>' :
      '<div style="font-size:10px;color:var(--muted)">No pending tasks</div>';

    el.innerHTML =
      '<div class="gw-wrap" onclick="openTaskPlugin(event)" style="cursor:pointer">' +
      '  <div class="gw-row1">' +
      '    <div class="gw-lvl-group">' +
      '      <span class="gw-badge">✓ TASKS</span>' +
      '      <span class="gw-rank">' + done + '/' + total + ' DONE</span>' +
      '    </div>' +
      '    <span class="gw-total">' + pct + '%</span>' +
      '  </div>' +
      '  <div class="gw-bar-track"><div class="gw-bar-fill" style="width:' + pct + '%"></div></div>' +
      taskSnippet +
      '  <div class="gw-chips">' +
      '    <span class="gw-chip"><span class="gw-dot ' + (done > 0 ? 'on' : 'off') + '"></span> DONE <span class="gw-chip-val">' + done + '</span></span>' +
      '    <span class="gw-chip">PENDING <span class="gw-chip-val">' + pending + '</span></span>' +
      '  </div>' +
      '</div>';
    return;
  }

  // Medium (170px) or Large (250px)
  var showCount = size === 'medium' ? 3 : 6;
  var rowsHtml = tasks.length === 0 ?
    '<div style="font-size:11px;color:var(--muted);padding:4px 0">No tasks scheduled</div>' :
    tasks.slice(0, showCount).map(function(t){
      var isDone = !!t.done;
      return '<div class="task-item" style="cursor:pointer">' +
             '  <span class="task-check ' + (isDone ? 'done' : '') + '" onclick="toggleTask(\'' + t.id + '\', event)">' + (isDone ? '✓' : '') + '</span>' +
             '  <span class="task-text ' + (isDone ? 'done' : '') + '" onclick="openTaskPlugin(event)">' + esc(t.title) + '</span>' +
             '  <span class="task-time">' + esc(t.deadline || '') + '</span>' +
             '</div>';
    }).join('');

  el.innerHTML =
    '<div class="gw-wrap" onclick="openTaskPlugin(event)" style="cursor:pointer">' +
    '  <div class="gw-row1">' +
    '    <div class="gw-lvl-group">' +
    '      <span class="gw-badge">✓ DIRECTIVES</span>' +
    '      <span class="gw-rank">' + done + ' OF ' + total + ' COMPLETED</span>' +
    '    </div>' +
    '    <span class="gw-total">' + pct + '%</span>' +
    '  </div>' +
    '  <div class="gw-bar-track">' +
    '    <div class="gw-bar-fill" style="width:' + pct + '%"></div>' +
    '  </div>' +
    '  <div class="task-list">' + rowsHtml + '</div>' +
    '  <div class="gw-chips">' +
    '    <span class="gw-chip"><span class="gw-dot ' + (done > 0 ? 'on' : 'off') + '"></span> DONE <span class="gw-chip-val">' + done + '</span></span>' +
    '    <span class="gw-chip">PENDING <span class="gw-chip-val">' + pending + '</span></span>' +
    '    <span class="gw-chip" onclick="openTaskPlugin(event)">MANAGE &rsaquo;</span>' +
    '  </div>' +
    '</div>';
}
draw();
window.addEventListener('storage', draw);
setInterval(draw, 15000);
</script>
</body>
</html>
