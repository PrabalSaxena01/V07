<div class="tool-view hidden" id="view-focus">
 <header class="sticky top-0 z-10 h-16 px-4 bg-surface/95 backdrop-blur-md border-b border-surface-container-high/40 flex items-center justify-between shadow-xs">
  <div class="flex items-center gap-2.5 min-w-0 flex-1 pr-2">
   <button aria-label="Back" class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-90 transition-transform cursor-pointer shrink-0" onclick="navigateBack()">
    <span class="material-symbols-outlined text-[24px]">
     arrow_back
    </span>
   </button>
   <div class="min-w-0 flex-1">
    <h2 class="text-base font-bold text-on-surface leading-tight truncate">
     Focus Sanctuary
    </h2>
    <p class="text-[11px] text-on-surface-variant leading-none truncate">
     Quiet intervals for deep presence
    </p>
   </div>
  </div>
  <div class="flex items-center gap-1 shrink-0">
   <button aria-label="Customize Notification" class="w-9 h-9 rounded-full flex items-center justify-center text-primary hover:bg-surface-container active:scale-95 transition-all cursor-pointer" onclick="openSessionNotifModal()" title="Session Notification Customization">
    <span class="material-symbols-outlined text-[20px]">
     notifications_active
    </span>
   </button>
   <button aria-label="Customize Focus Sanctuary" class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all cursor-pointer" onclick="openPluginSettingsModal('focus')" title="Customize Focus Sanctuary">
    <span class="material-symbols-outlined text-[20px]">
     settings
    </span>
   </button>
   <button aria-label="Reset focus timer" class="w-9 h-9 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container active:scale-95 transition-all cursor-pointer" onclick="resetFocusTimer()" title="Reset">
    <span class="material-symbols-outlined text-[20px]">
     restart_alt
    </span>
   </button>
  </div>
 </header>
 <div class="flex-1 p-4 pb-32 max-w-[500px] mx-auto w-full space-y-4">
  <!-- Daily Focus Target & Progress Bar -->
  <div class="w-full bg-surface-container-lowest rounded-2xl p-4 border border-surface-container-high/40 flex flex-col gap-2.5 shadow-2xs" style="box-shadow: var(--card-shadow);">
   <div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
     <span class="material-symbols-outlined text-primary text-[18px]">
      track_changes
     </span>
     <span class="text-xs font-bold text-on-surface">
      Daily Focus Goal
     </span>
    </div>
    <div class="flex items-center gap-2">
     <button aria-label="Decrease focus goal by 15 minutes" class="w-8 h-8 rounded-lg bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-on-surface-variant text-xs font-bold active:scale-90 transition-all cursor-pointer" onclick="adjustDailyFocusTarget(-15)" title="Decrease">
      -
     </button>
     <span class="text-xs font-bold text-primary px-1" id="focus-daily-target-text">
      90 min
     </span>
     <button aria-label="Increase focus goal by 15 minutes" class="w-8 h-8 rounded-lg bg-surface-container-low hover:bg-surface-container flex items-center justify-center text-on-surface-variant text-xs font-bold active:scale-90 transition-all cursor-pointer" onclick="adjustDailyFocusTarget(15)" title="Increase">
      +
     </button>
    </div>
   </div>
   <div class="w-full h-2 rounded-full bg-surface-container overflow-hidden">
    <div class="h-full bg-primary rounded-full transition-all duration-500" id="focus-daily-target-bar" style="width: 0%;">
    </div>
   </div>
   <div class="flex items-center justify-between text-[11px] text-on-surface-variant font-medium">
    <span id="focus-daily-target-sub">
     0 of 90 min completed
    </span>
    <span class="font-bold text-primary" id="focus-daily-target-pct">
     0%
    </span>
   </div>
  </div>
  <!-- Mode Switcher: Pomodoro vs Timer -->
  <div class="w-full p-1 bg-surface-container-low rounded-2xl flex items-center justify-between border border-surface-container-high/40">
   <button class="flex-1 py-2 px-3 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-1.5 bg-surface-container-lowest text-primary shadow-xs cursor-pointer" id="focus-mode-pomodoro" onclick="setFocusMode('pomodoro')">
    <span class="material-symbols-outlined text-[16px]">
     timelapse
    </span>
    <span>
     Pomodoro Mode
    </span>
   </button>
   <button class="flex-1 py-2 px-3 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-1.5 text-on-surface-variant hover:text-on-surface cursor-pointer" id="focus-mode-timer" onclick="setFocusMode('timer')">
    <span class="material-symbols-outlined text-[16px]">
     hourglass_empty
    </span>
    <span>
     Timer Mode
    </span>
   </button>
  </div>
  <!-- Main Chronometer Card with Progress Dial -->
  <div class="w-full bg-surface-container-lowest rounded-2xl p-6 border border-surface-container-high/40 flex flex-col items-center relative overflow-hidden" style="box-shadow: var(--card-shadow);">
   <div class="w-full flex items-center justify-between text-xs mb-2">
    <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-primary-fixed text-primary font-bold">
     <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse">
     </span>
     <span id="focus-cycle-badge">
      Focus Session
     </span>
    </div>
    <span class="text-on-surface-variant font-medium flex items-center gap-1">
     <span class="material-symbols-outlined text-[15px] text-secondary">
      flag
     </span>
     <span id="focus-target-duration">
      25 Minutes
     </span>
    </span>
   </div>
   <!-- Circular Dial Ring -->
   <div class="relative w-60 h-60 flex items-center justify-center my-2">
    <svg class="w-full h-full transform -rotate-90" viewbox="0 0 240 240">
     <circle cx="120" cy="120" fill="transparent" r="100" stroke="var(--surface-container-high)" stroke-width="7">
     </circle>
     <circle class="transition-all duration-1000 ease-linear" cx="120" cy="120" fill="transparent" id="focus-progress-ring" r="100" stroke="var(--primary)" stroke-dasharray="628.31" stroke-dashoffset="0" stroke-linecap="round" stroke-width="7">
     </circle>
    </svg>
    <div class="absolute flex flex-col items-center justify-center text-center select-none max-w-[190px] px-1">
     <span class="tabular-nums text-4xl font-bold text-on-surface tracking-tight font-sans transition-all leading-none" id="focus-modal-time">
      25:00
     </span>
     <span class="text-xs font-bold text-primary flex items-center gap-1 mt-2 uppercase tracking-wide" id="focus-modal-phase">
      <span class="material-symbols-outlined text-[14px]">
       lock_clock
      </span>
      <span>
       Focus Ready
      </span>
     </span>
     <span class="mt-1.5 text-[11px] font-semibold px-2.5 py-0.5 rounded-md bg-surface-container-low text-secondary" id="focus-active-tag">
      Deep Work
     </span>
    </div>
   </div>
   <!-- Time Adjust Controls (-5m / +5m) -->
   <div class="flex items-center gap-3 mt-1">
    <button class="h-8 px-3.5 rounded-lg bg-surface-container-low hover:bg-surface-container active:scale-95 text-on-surface-variant text-xs font-bold transition-all flex items-center gap-1 cursor-pointer" onclick="adjustFocusMinutes(-5)">
     <span class="material-symbols-outlined text-[14px]">
      remove
     </span>
     5m
    </button>
    <button class="h-8 px-3.5 rounded-lg bg-surface-container-low hover:bg-surface-container active:scale-95 text-on-surface-variant text-xs font-bold transition-all flex items-center gap-1 cursor-pointer" onclick="adjustFocusMinutes(5)">
     <span class="material-symbols-outlined text-[14px]">
      add
     </span>
     5m
    </button>
   </div>
   <!-- Primary Actions -->
   <div class="flex items-center gap-2 mt-4 flex-wrap justify-center">
    <button class="h-11 px-3.5 rounded-xl bg-surface-container-low hover:bg-surface-container active:scale-95 text-on-surface-variant flex items-center gap-1 font-bold text-xs border border-surface-container-high/40 cursor-pointer" onclick="resetFocusTimer()">
     <span class="material-symbols-outlined text-[17px]">
      restart_alt
     </span>
     <span>
      Reset
     </span>
    </button>
    <button class="h-12 px-6 rounded-xl bg-primary hover:opacity-95 text-on-primary active:scale-95 transition-all flex items-center gap-2 font-bold text-sm shadow-md cursor-pointer" id="focus-modal-toggle-btn" onclick="toggleFocusTimer()">
     <span class="material-symbols-outlined text-[20px]" id="focus-modal-play-icon">
      play_arrow
     </span>
     <span id="focus-modal-play-text">
      Start focus
     </span>
    </button>
    <button class="hidden h-11 px-3.5 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 text-amber-700 dark:text-amber-400 active:scale-95 flex items-center gap-1.5 font-bold text-xs border border-amber-500/30 cursor-pointer transition-all" id="focus-modal-stop-btn" onclick="stopAndLogFocusSession()" title="Stop &amp; Log Session Mid-way">
     <span class="material-symbols-outlined text-[17px]">
      stop_circle
     </span>
     <span>
      Stop &amp; Log
     </span>
    </button>
    <button class="h-11 w-11 rounded-xl bg-surface-container-low hover:bg-surface-container active:scale-95 text-on-surface-variant flex items-center justify-center border border-surface-container-high/40 cursor-pointer" onclick="skipFocusCycle()" title="Next Interval">
     <span class="material-symbols-outlined text-[18px]">
      skip_next
     </span>
    </button>
   </div>
  </div>
  <!-- Duration Preset Pills & Custom Time -->
  <div class="flex flex-col space-y-2">
   <div class="flex items-center justify-between px-1">
    <span class="text-xs font-bold uppercase text-on-surface-variant">
     Duration
    </span>
    <button class="text-xs font-semibold text-primary hover:underline flex items-center gap-1 cursor-pointer" onclick="toggleCustomTimePanel()">
     <span class="material-symbols-outlined text-[14px]">
      tune
     </span>
     <span>
      Custom Time
     </span>
    </button>
   </div>
   <div class="grid grid-cols-4 gap-2">
    <button class="py-2.5 px-2 rounded-xl bg-surface-container-lowest border border-surface-container-high hover:border-primary text-center transition-all cursor-pointer" onclick="setFocusPreset(15)">
     <div class="text-sm font-bold text-on-surface">
      15m
     </div>
     <div class="text-[10px] text-on-surface-variant">
      Sprint
     </div>
    </button>
    <button class="py-2.5 px-2 rounded-xl bg-primary-fixed border border-primary text-center transition-all cursor-pointer" onclick="setFocusPreset(25)">
     <div class="text-sm font-bold text-primary">
      25m
     </div>
     <div class="text-[10px] text-primary">
      Standard
     </div>
    </button>
    <button class="py-2.5 px-2 rounded-xl bg-surface-container-lowest border border-surface-container-high hover:border-primary text-center transition-all cursor-pointer" onclick="setFocusPreset(45)">
     <div class="text-sm font-bold text-on-surface">
      45m
     </div>
     <div class="text-[10px] text-on-surface-variant">
      Focused
     </div>
    </button>
    <button class="py-2.5 px-2 rounded-xl bg-surface-container-lowest border border-surface-container-high hover:border-primary text-center transition-all cursor-pointer" onclick="setFocusPreset(60)">
     <div class="text-sm font-bold text-on-surface">
      60m
     </div>
     <div class="text-[10px] text-on-surface-variant">
      Deep
     </div>
    </button>
   </div>
   <!-- Collapsible Custom Time Panel -->
   <div class="hidden p-3 bg-surface-container-lowest rounded-xl border border-surface-container-high flex items-center justify-between gap-3" id="custom-time-panel">
    <span class="text-xs text-on-surface-variant font-medium">
     Set custom minutes:
    </span>
    <div class="flex items-center gap-2">
     <input class="w-16 h-8 text-center text-xs font-bold rounded-lg bg-surface-container-low border border-surface-container-high text-on-surface focus:outline-none focus:border-primary" id="custom-minutes-input" max="180" min="1" type="number" value="30"/>
     <button class="h-8 px-3 rounded-lg bg-primary text-on-primary font-bold text-xs hover:opacity-90 transition-opacity cursor-pointer" onclick="applyCustomTime()">
      Apply
     </button>
    </div>
   </div>
  </div>
  <!-- Session Notification Customization Shortcut Banner -->
  <button class="w-full py-2.5 px-3.5 rounded-2xl bg-surface-container-lowest hover:bg-surface-container-low border border-surface-container-high/50 flex items-center justify-between text-xs font-semibold text-on-surface cursor-pointer active:scale-[0.99] transition-all shadow-2xs" onclick="openSessionNotifModal()" type="button">
   <div class="flex items-center gap-2.5 min-w-0">
    <div class="w-7 h-7 rounded-xl bg-primary/10 text-primary flex items-center justify-center shrink-0">
     <span class="material-symbols-outlined text-[16px]">
      notifications_active
     </span>
    </div>
    <div class="flex flex-col text-left min-w-0">
     <span class="text-xs font-bold text-on-surface truncate">
      Notification Customization
     </span>
     <span class="text-[10px] text-on-surface-variant truncate" id="session-notif-preview-chip">
      Live progress bar, direct pause/reset, mindful quotes
     </span>
    </div>
   </div>
   <div class="flex items-center gap-1 text-[11px] text-primary font-bold shrink-0">
    <span>
     Customize
    </span>
    <span class="material-symbols-outlined text-[15px]">
     tune
    </span>
   </div>
  </button>
  <!-- Session Details (Activity & Label Dropdowns from Stitch) -->
  <div class="bg-surface-container-lowest rounded-2xl p-4 border border-surface-container-high/40 flex flex-col space-y-3" style="box-shadow: var(--card-shadow);">
   <div class="flex items-center justify-between">
    <span class="text-xs font-bold uppercase text-on-surface-variant">
     Session Details
    </span>
    <span class="text-[11px] text-primary font-semibold flex items-center gap-1" id="details-summary-pill">
     <span class="w-1.5 h-1.5 rounded-full bg-primary">
     </span>
     <span>
      Deep Work • #urgent
     </span>
    </span>
   </div>
   <div class="grid grid-cols-2 gap-2.5">
    <div class="flex flex-col space-y-1">
     <label class="text-[11px] font-medium text-on-surface-variant flex items-center gap-1" for="focus-activity-select">
      <span class="material-symbols-outlined text-[13px] text-primary">
       psychology
      </span>
      Activity
     </label>
     <select class="w-full h-9 px-2.5 rounded-xl bg-surface-container-low border border-surface-container-high text-xs font-semibold text-on-surface focus:outline-none focus:border-primary cursor-pointer" id="focus-activity-select" onchange="onActivitySelectChanged(this)">
      <option selected="" value="Deep Work">
       Deep Work
      </option>
      <option value="Reading">
       Reading
      </option>
      <option value="Writing">
       Writing
      </option>
      <option value="Coding">
       Coding
      </option>
      <option value="Reflection">
       Reflection
      </option>
      <option value="Planning">
       Planning
      </option>
      <option class="font-bold text-primary" value="__add_custom__">
       + Add custom activity...
      </option>
     </select>
    </div>
    <div class="flex flex-col space-y-1">
     <label class="text-[11px] font-medium text-on-surface-variant flex items-center gap-1" for="focus-label-select">
      <span class="material-symbols-outlined text-[13px] text-primary">
       tag
      </span>
      Label / Tag
     </label>
     <select class="w-full h-9 px-2.5 rounded-xl bg-surface-container-low border border-surface-container-high text-xs font-semibold text-on-surface focus:outline-none focus:border-primary cursor-pointer" id="focus-label-select" onchange="onLabelSelectChanged(this)">
      <option selected="" value="#urgent">
       #urgent
      </option>
      <option value="#project-v07">
       #project-v07
      </option>
      <option value="#mindful">
       #mindful
      </option>
      <option value="#draft">
       #draft
      </option>
      <option class="font-bold text-primary" value="__add_custom__">
       + Add custom label...
      </option>
     </select>
    </div>
   </div>
  </div>
  <!-- Elapsed / Completed Sessions List -->
  <div class="flex flex-col space-y-2">
   <div class="flex items-center justify-between px-1">
    <div class="flex items-center gap-1.5">
     <span class="material-symbols-outlined text-primary text-[16px]">
      history
     </span>
     <span class="text-xs font-bold uppercase text-on-surface-variant tracking-wider">
      Today's Elapsed Sessions
     </span>
    </div>
    <span class="text-[11px] text-primary font-semibold" id="focus-elapsed-count">
     0 sessions
    </span>
   </div>
   <div class="space-y-2 pt-0.5" id="focus-elapsed-sessions-list">
    <!-- Dynamically populated by loadElapsedSessions() -->
   </div>
  </div>
 </div>
</div>
